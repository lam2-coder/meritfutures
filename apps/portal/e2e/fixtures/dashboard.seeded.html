<!doctype html>
<!--
  apps/portal/e2e/fixtures/dashboard.seeded.html

  THE SEEDED VIOLATION FOR THE PORTAL. Same obligation as the site's seed and
  the same warning: DO NOT REPAIR THIS FILE. It exists so that every run proves
  the eight checks still fire, and a check that stops firing against it is a
  check that has stopped reading.

  IT IS A DIFFERENT SEED RATHER THAN A COPY, and that is deliberate. The site's
  seed is the templated marketing page; this one is the templated DASHBOARD,
  which is where the tells arrive as a component library's defaults rather than
  as a landing-page layout: stat cards with shadows, a lavender accent nobody
  chose, an emoji standing in for a status icon, and a colored left border used
  as a severity stripe. That last one is exactly the variant DESIGN_SYSTEM
  section 1.3 says the rule is written down to prevent somebody re-deriving.

  WHAT IS SEEDED, BY CHECK:
    SS-01  a blue-to-purple gradient on the balance panel
    SS-02  a 6px lavender left border used as a severity stripe
    SS-03  Montserrat on the headings and Geist on the figures
    SS-04  Tailwind gray, lavender and pure black
    SS-05  five rounded stat cards with shadows
    SS-06  "Elevate" and "Discover" opening sentences
    SS-07  a check mark in a declared icon slot and a money bag standing alone
    SS-08  an em-dash in the ladder note
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merit portal, the templated version</title>
    <style>
      html {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        font-size: 16px;
      }

      body {
        margin: 0;
        padding: 16px;
        background-color: #0f172a;
        color: #e2e8f0;
      }

      h1,
      h2,
      h3 {
        font-family: Montserrat, sans-serif;
        color: #f8fafc;
      }

      /* DG-01 on a dashboard rather than on a hero. */
      .balance {
        padding: 24px;
        border-radius: 20px;
        background-image: linear-gradient(120deg, #3b82f6 0%, #8b5cf6 100%);
        color: #ffffff;
        box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.4);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      /* DG-08 and DG-09: the untouched default card, repeated. */
      .stat {
        flex: 1 1 140px;
        padding: 16px;
        border: 1px solid #334155;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        background-color: #1e293b;
      }

      .stat .figure {
        font-family: Geist, monospace;
        font-size: 24px;
        color: #a78bfa;
      }

      /* DG-07: the colored left border, arriving as a severity stripe, which is
         the variant DESIGN_SYSTEM section 1.3 names in advance. */
      .notice {
        margin-top: 16px;
        padding: 12px 16px;
        border-left: 6px solid #a855f7;
        border-radius: 8px;
        background-color: #1e1b4b;
        color: #ddd6fe;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }

      .ladder {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #334155;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        background-color: #000000;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <section class="balance">
      <h1>Elevate your funded account</h1>
      <p class="figure">$4,182.00</p>
    </section>

    <div class="stats">
      <div class="stat">
        <p><span data-icon="check">&#9989;</span></p>
        <h3>Consistency</h3>
        <p class="figure">38.4%</p>
      </div>
      <div class="stat">
        <p>&#128176;</p>
        <h3>Win Days</h3>
        <p class="figure">3</p>
      </div>
      <div class="stat">
        <h3>Headroom</h3>
        <p class="figure">$412</p>
      </div>
      <div class="stat">
        <h3>Ladder Step</h3>
        <p class="figure">2</p>
      </div>
      <div class="stat">
        <h3>Days Funded</h3>
        <p class="figure">42</p>
      </div>
    </div>

    <div class="notice">
      <p>Discover the fastest route to your next payout.</p>
    </div>

    <div class="ladder">
      <p>
        Your next request opens on 2026-09-02 &#8212; keep trading and we will handle the rest.
      </p>
    </div>
  </body>
</html>

name: ci

# =============================================================================
# CI-01, CI-02 and CI-05 (STRATEGY section 4.1), session S-C of P1 section 6.
# =============================================================================
# Three stages. Each runs on every push, each blocks on its own, and NONE OF
# THEM `needs:` ANOTHER. That is the ruling rather than a preference:
# STRATEGY section 4.1 makes them separate rows because a lint failure must not
# hide a security finding behind a skipped job. `corpus.yml` is the fourth
# stage, CI-06, and is a separate file with a separate owner.
#
#   CI-01  Lint and types      tsc --noEmit, ESLint (VG-4), prettier, RI-01..05
#   CI-02  Unit and property   Vitest, the `unit` and `property` projects
#   CI-05  Security static     gitleaks (VG-1), semgrep, pnpm audit,
#                              syft SBOM + grype scan, --frozen-lockfile (VG-12)
#
# -----------------------------------------------------------------------------
# EVERY STAGE PROVES ITSELF FAILING, IN ITS OWN JOB
# -----------------------------------------------------------------------------
# `scripts/ci/falsify-ci.mjs <stage>` seeds one violation aimed at each gate the
# stage carries and requires the gate to fail ON THAT FINDING. P1 section 6:
# "Every gate any of these sessions wires ships with a seeded violation, and
# must fail on that finding rather than merely exit non-zero." STATE is sharper:
# two of the eleven corpus gates once failed on a truncated tree copy and would
# have been scored as working.
#
# It is the LAST step of each job rather than a fourth job, so a stage cannot be
# green while the proof that it can fail lives somewhere a person deleted.
#
# -----------------------------------------------------------------------------
# WHAT CI-02 IS GREEN ABOUT TODAY, WHICH IS NOT WHAT ITS ROW EVENTUALLY MEANS
# -----------------------------------------------------------------------------
# STRATEGY section 4.1 gives CI-02 "Vitest across packages, the `PT-nn` suites,
# every module's `Mxx-*-nn` suites". THE `PT-nn` AND `Mxx-*-nn` SUITES DO NOT
# EXIST. They arrive with P2, when there is an engine to state a property about.
# What runs today is the scaffold's placeholder tests plus the two real suites
# S-B and this session wrote: the repository invariants and the ESLint rules,
# each watched failing on a seeded violation.
#
# The stage is wired so those suites join it with NO WORKFLOW CHANGE: a file
# named `*.property.test.ts` lands in the `property` project by the glob in
# `vitest.config.ts`, and any `test/**/*.test.ts` lands in `unit`. A STAGE THAT
# IS GREEN BECAUSE IT HAS NOTHING TO RUN IS NOT THE SAME OBJECT AS A STAGE THAT
# IS GREEN BECAUSE IT PASSED, and the difference has to be said out loud
# somewhere the reader is, not inferred from a check mark.
#
# -----------------------------------------------------------------------------
# NODE, pnpm AND WHY NEITHER IS AN ACTION
# -----------------------------------------------------------------------------
# The Node version is read from `.nvmrc` and appears nowhere else (OQ-P1-03,
# rider 3); `RI-05` fails any workflow that pins it inline. pnpm comes from
# Corepack reading `packageManager` in the root manifest, which is the same
# argument one level down: the version is already written in a file this
# repository owns, so a `pnpm/action-setup` version input would be a second
# place holding it.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---------------------------------------------------------------------------
  # THE CI-05 SCANNERS, PINNED, IN ONE PLACE
  # ---------------------------------------------------------------------------
  # A scanner installed at `latest` is a gate whose behavior changes on a day
  # nobody touched this repository, which is the same defect as an unpinned
  # dependency and is the thing VG-12 exists to stop. Pinning the scanners is
  # VG-12 applied to the tools that enforce VG-12.
  #
  # A VERSION PIN SAYS WHICH RELEASE; A DIGEST SAYS WHICH BYTES. Only the second
  # survives a re-tagged or replaced release asset, which is the supply-chain
  # event VG-12 is about, aimed at the scanners rather than at the dependencies
  # they scan. `install-pinned-tool.sh` enforces the digest when one is given
  # and emits a `::warning::` when it is not, so an unpinned digest cannot look
  # identical to a pinned one in the log.
  #
  # Each sha256 below was READ FROM THE RUN THAT DOWNLOADED IT, not from a
  # release page. Bumping a version means the digest moves with it: take the
  # new value from the same step's output. If a digest changes while the
  # version does not, that is the event this pin exists to catch, and the fix
  # is not to update the number.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  # 1.29.0 and 0.95.0 were the first guesses and both installed cleanly, which
  # is why the drift step exists: nothing 404s and nothing complains. `grype`
  # then failed to hydrate its own database ("unable to migrate: constraint
  # failed ... operating_systems"), because the schema the current database is
  # published in is not the one a grype 22 minors old can migrate. A SCANNER
  # BEHIND ITS OWN DATABASE DOES NOT REPORT A SMALLER SET OF FINDINGS, IT
  # REPORTS NONE.
  SYFT_VERSION: '1.51.0'
  SYFT_SHA256: '2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f'
  GRYPE_VERSION: '0.117.0'
  GRYPE_SHA256: '38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26'
  # Verified against PyPI before it was written here, rather than guessed.
  SEMGREP_VERSION: '1.173.0'

  # Every grype invocation in this workflow uses the database the CI-05 job
  # explicitly fetched, INCLUDING THE ONE INSIDE falsify-ci.mjs, which is a
  # child process and inherits this. Left at its default, the seeded-violation
  # case re-downloads the whole database to scan a directory containing one
  # package, and reintroduces the unbounded wait one step after it was removed.
  GRYPE_DB_AUTO_UPDATE: 'false'

jobs:
  # ===========================================================================
  # CI-01  Lint and types
  # ===========================================================================
  lint-and-types:
    name: CI-01 lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # RIDER 3, OQ-P1-03. `.nvmrc` is the only place the Node version is
          # written, and RI-05 below asserts no workflow pins it inline.
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # VG-12's first part, and P1 section 4's first definition-of-done line.
      # The lockfile is the admitted dependency tree; an install that is allowed
      # to update it is an install that admits packages nobody approved.
      - name: Install, frozen
        run: pnpm install --frozen-lockfile

      # The scaffold invariants, which P1 section 2 argues a cheap choice
      # destroys silently: the engine's manifest purity (RI-01), the absence of
      # a coverage gate (RI-02), the Vitest projects being the CI stages
      # (RI-03), four separate deployables (RI-04) and one Node version (RI-05).
      # They run FIRST because RI-03 is the check that says whether the next
      # job's `--project` selectors mean anything.
      - name: Repository invariants (RI-01 to RI-05)
        run: node packages/tooling/checks/repo-invariants.mjs

      - name: Types
        run: pnpm run typecheck

      # VG-4 (`merit/no-raw-db-client`) and `merit/engine-purity` run here,
      # along with STRATEGY section 4.5's anti-slop rules. Each is `error`, so
      # each blocks: a lint rule set to warn is a rule that gets scrolled past.
      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Gates are falsifiable
        run: node scripts/ci/falsify-ci.mjs CI-01

  # ===========================================================================
  # CI-02  Unit and property
  # ===========================================================================
  unit-and-property:
    name: CI-02 unit and property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Install, frozen
        run: pnpm install --frozen-lockfile

      # THE TWO PROJECTS CI-02 OWNS, NAMED. `golden` is CI-03 and `integration`
      # is CI-04, and both are deliberately absent: P1 section 2.2 makes the
      # projects map to CI STAGES rather than to packages precisely so that this
      # line can exist. `vitest run` with no selector would make CI-02 go red
      # for a CI-03 failure and there would be no way to tell them apart.
      #
      # Vitest exits non-zero when a selected project matches no test files, so
      # a project emptied by a bad glob fails here rather than reporting green
      # for having looked at nothing. That is not configured; it is the default,
      # and `--passWithNoTests` must never be added to this line.
      - name: Unit and property suites
        run: pnpm exec vitest run --project unit --project property

      - name: Gates are falsifiable
        run: node scripts/ci/falsify-ci.mjs CI-02

  # ===========================================================================
  # CI-05  Security static
  # ===========================================================================
  security-static:
    name: CI-05 security static
    runs-on: ubuntu-latest
    # A BLOCKING GATE THAT HANGS IS WORSE THAN ONE THAT FAILS. grype's
    # vulnerability database comes from an external CDN, and on the run that
    # first turned this stage green it took 55 seconds while a later run sat on
    # the same step for twenty minutes. The default job timeout is SIX HOURS,
    # which on a merge blocker means a pull request nobody can land and nobody
    # can diagnose. Twenty minutes is roughly ten times the observed good case.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # VG-1 IS "gitleaks ON THE DIFF AND THE FULL HISTORY" and a shallow
          # clone has no history to scan. The gate would pass by being unable
          # to look, which is the failure mode corpus.yml's CI-06f comment
          # names about its own fetch depth.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # VG-12, part one. It is repeated in every job on purpose: a stage that
      # installs with an unfrozen lockfile is a stage testing a tree that is not
      # the tree under review.
      - name: Install, frozen
        run: pnpm install --frozen-lockfile

      # EVERY TOOL IS ATTEMPTED EVEN AFTER ONE FAILS, and the step fails at the
      # end. A stale pin is reported by the installer with the tag upstream
      # currently publishes; aborting on the first one would mean one run per
      # stale pin, which on the first run of this workflow was three runs to
      # learn three numbers.
      - name: Install the pinned scanners
        run: |
          set -uo pipefail
          chmod +x scripts/ci/install-pinned-tool.sh
          status=0
          sudo -E scripts/ci/install-pinned-tool.sh gitleaks/gitleaks "$GITLEAKS_VERSION" \
            'gitleaks_{v}_linux_x64.tar.gz' gitleaks "$GITLEAKS_SHA256" || status=1
          sudo -E scripts/ci/install-pinned-tool.sh anchore/syft "$SYFT_VERSION" \
            'syft_{v}_linux_amd64.tar.gz' syft "$SYFT_SHA256" || status=1
          sudo -E scripts/ci/install-pinned-tool.sh anchore/grype "$GRYPE_VERSION" \
            'grype_{v}_linux_amd64.tar.gz' grype "$GRYPE_SHA256" || status=1
          python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}" || status=1
          semgrep --version || status=1
          exit $status

      # A PIN NOBODY LOOKS AT IS A PIN THAT AGES, and a scanner three majors
      # behind reports green about a rule set it does not have. This step never
      # fails: a stale pin is a decision to make, not a build to break, and a
      # gate that goes red because somebody else shipped a release is a gate
      # that gets bypassed with a flag.
      #
      # It also earned its place immediately. The pins in this file were
      # guessed, and this is what tells a session which numbers are real
      # without waiting for a 404 that only fires on the first stale one.
      - name: Scanner pin drift
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for spec in "gitleaks/gitleaks:$GITLEAKS_VERSION" "anchore/syft:$SYFT_VERSION" "anchore/grype:$GRYPE_VERSION"; do
            repo="${spec%:*}"; pinned="${spec##*:}"
            tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${repo}/releases/latest" 2>/dev/null \
              | sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p' | head -1)
            if [ -z "$tag" ]; then
              echo "${repo}: could not reach the release API"
            elif [ "$tag" = "$pinned" ]; then
              echo "${repo}: pinned at ${pinned}, current"
            else
              echo "::notice::${repo} is pinned at ${pinned}; upstream publishes ${tag}"
            fi
          done
          exit 0

      # -----------------------------------------------------------------------
      # VG-1, secret scan
      # -----------------------------------------------------------------------
      # BOTH DIRECTIONS, because they find different things. `git` walks every
      # commit, which is where a secret that was committed and then deleted
      # still lives; `dir` reads the tree as it stands, which catches a file
      # that history has not seen yet. A repository scanned only one way has a
      # blind spot in whichever direction was skipped.
      - name: VG-1 secret scan, full history
        run: gitleaks git . --redact --no-banner --exit-code 1

      - name: VG-1 secret scan, working tree
        run: gitleaks dir . --redact --no-banner --exit-code 1

      # -----------------------------------------------------------------------
      # semgrep
      # -----------------------------------------------------------------------
      # Two halves. `.semgrep/merit.yml` is the half this repository owns and
      # each of its rules cites the document it enforces; the registry rulesets
      # are the generic security coverage nobody should hand-write.
      #
      # THE REGISTRY HALF CAN GO RED ON A DAY NOBODY TOUCHED THIS TREE, because
      # its rules are upstream and they change. That is a real cost and it is
      # accepted rather than hidden: the alternative is a vendored copy that
      # stops receiving the rules that make it worth running. It is also why the
      # falsification seed targets an OWNED rule, whose text this repository
      # controls.
      - name: semgrep
        run: |
          semgrep scan \
            --config .semgrep/merit.yml \
            --config p/typescript \
            --config p/secrets \
            --error --metrics=off --quiet

      # -----------------------------------------------------------------------
      # VG-12, SCA
      # -----------------------------------------------------------------------
      - name: Dependency advisories
        run: pnpm audit --audit-level=moderate

      # -----------------------------------------------------------------------
      # VG-12, SBOM and scan
      # -----------------------------------------------------------------------
      # The SBOM is built from the INSTALLED tree rather than from the manifests,
      # so it lists what a deployment would actually contain: transitive
      # packages included, which is where a hallucinated or typosquatted name
      # arrives without appearing in any diff a human read.
      - name: VG-12 SBOM
        run: |
          syft scan dir:. -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json -q
          echo "SBOM components: $(node -e "process.stdout.write(String((JSON.parse(require('node:fs').readFileSync('sbom.cdx.json','utf8')).components||[]).length))")"

      # ACQUIRING THE DATABASE IS A SEPARATE STEP FROM SCANNING WITH IT, and
      # that is the whole point rather than tidiness. Folded into the scan, an
      # unbounded download from an external CDN is indistinguishable from a scan
      # that will not finish: this stage sat on one combined step for twenty
      # minutes with nothing to read. Split, the download has its own name, its
      # own bound, and its own cache, and the scan that follows is local
      # arithmetic over an SBOM.
      #
      # The cache key rolls: `run_id` makes every run write a fresh entry and
      # `restore-keys` reads the newest matching one, so the DB is warm without
      # ever being pinned to a stale copy. Keyed on the grype version because
      # the database schema is what a version bump changes, which is the
      # failure this stage already hit once.
      - name: VG-12 vulnerability database
        timeout-minutes: 8
        env:
          GRYPE_DB_AUTO_UPDATE: 'true'
        run: grype db update -v

      - name: Cache the vulnerability database
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ env.GRYPE_VERSION }}-${{ github.run_id }}
          restore-keys: grype-db-${{ env.GRYPE_VERSION }}-

      # `--db-auto-update=false`: the database is the step above's job. Left on,
      # a scan silently re-downloads and this step inherits the unbounded wait
      # the split exists to remove. A stale or missing database now fails LOUDLY
      # here rather than being repaired invisibly.
      - name: VG-12 vulnerability scan
        timeout-minutes: 5
        run: grype sbom:sbom.cdx.json --fail-on medium --db-auto-update=false -o table

      # The SBOM is the artifact VG-12 asks for, and an SBOM that exists only
      # inside a finished job is an SBOM nobody can diff against last week's.
      #
      # The guard is `there is an SBOM`, not `the job is passing`: the run whose
      # SBOM is most worth keeping is the one where grype went red. `always()`
      # alone was wrong and the first CI run proved it, turning a failed scanner
      # install into a SECOND red step complaining about a file that could not
      # exist.
      - name: Keep the SBOM
        if: always() && hashFiles('sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # VG-12, the human-approval half
      # -----------------------------------------------------------------------
      # THIS STEP DOES NOT BLOCK AND MUST NOT PRETEND TO. A job can see that the
      # dependency surface changed; it cannot see that a human agreed to it, and
      # a green check that reads as an approval nobody gave is worse than no
      # check. The approval is enforced by `.github/CODEOWNERS` plus the branch
      # protection setting that requires a code-owner review, which lives in
      # repository settings and not in this file.
      #
      # What this step is for is that the requirement appears in the log of the
      # run a reviewer is already looking at, naming the exact files, rather
      # than living only in a policy document.
      - name: VG-12 dependency surface, for the human half
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          changed=$(git diff --name-only "$base"...HEAD -- \
            pnpm-lock.yaml pnpm-workspace.yaml .npmrc package.json \
            'apps/*/package.json' 'packages/*/package.json' || true)
          if [ -z "$changed" ]; then
            echo "The dependency surface is unchanged on this pull request."
            exit 0
          fi
          {
            echo "### VG-12: this pull request changes the dependency surface"
            echo
            echo 'Every new package needs a named human approval (STRATEGY section 4.2). That'
            echo 'approval is a code-owner review on the files below, not this check.'
            echo
            echo '```'
            echo "$changed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::VG-12: dependency surface changed. A code-owner review is required for the new packages."
          echo "$changed"

      - name: Gates are falsifiable
        run: node scripts/ci/falsify-ci.mjs CI-05

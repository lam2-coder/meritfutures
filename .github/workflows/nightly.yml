name: nightly

# =============================================================================
# CI-09, nightly (STRATEGY section 4.1). WAVE-04 W7, session 114.
# =============================================================================
# ONE LEG OF FOUR, AND THE COUNT IS THE RULING RATHER THAN THE BUDGET.
# ADR-073 section 5 rules each of CI-09's four legs separately:
#
#   Simulation harness    BUILT. It "needs none" of the inputs the others wait
#                         on: pure compute from a seed, folding the real engine
#   Replay self-audit     BUILT, 2026-08-27. The artifact it waited on arrived
#                         as `scripts/demo/world.ts` (ADR-119), and the reason
#                         it could not be built before is exactly why the world
#                         had to come first: `runReplayAudit` reads stored
#                         state, and with zero rows its OI-14 refusal DOES NOT
#                         FIRE, so a nightly over an empty world would report
#                         `accountsAudited: 0, diverged: 0` and exit green
#                         every night, over nothing. The seed runner carries
#                         the `accountsAudited === 0` refusal that closes that,
#                         and ADR-119 clause 7 records it as OWED A HOME IN
#                         `replay.ts`: a refusal in the caller is weaker than a
#                         refusal in the audit, because the next caller
#                         inherits nothing
#   Stryker on the engine WAITING, 2026-08-20, on the VG-12 admission, whose
#                         human half a session cannot grant itself
#   Detector canary       WAITING, 2026-08-20, on M07's detector code. `canary`
#                         appears in no `.ts` file in this tree
#
# THE TWO REMAINING ABSENT LEGS ARE NOT SKIPPED STEPS AND MUST NOT BECOME ONE. ADR-073
# rejects that shape by name: "a job whose every step is `if: false` satisfies
# (a) by a parse and satisfies nothing else, and it is strictly worse than (b)
# because it removes the day the condition would have fired." Their conditions
# are read by `CI-06/gate-inventory`, which is a later session's.
#
# -----------------------------------------------------------------------------
# WHAT THIS JOB IS FOR, WHICH IS A THING NOTHING ELSE IN THE PIPELINE DOES
# -----------------------------------------------------------------------------
# Session 106's landmine, confirmed against the tree by ADR-073 section 5:
# `packages/harness` "exists with its own tests; nothing calls it", and no file
# outside the package imports `@merit/harness`. THIS JOB IS ITS CONSUMER, at
# SIMULATION_HARNESS section 1's own scale: "run 10,000 synthetic traders
# through the real engine nightly in CI".
#
# -----------------------------------------------------------------------------
# HOW A FAILURE IS SEEN, STATED PLAINLY BECAUSE THE HONEST ANSWER IS SMALL
# -----------------------------------------------------------------------------
# On a red run this job writes its full report to the Actions STEP SUMMARY of
# the run and uploads `test-results/` as an artifact. Both are on the run page.
#
# WHO READS THAT PAGE TODAY: the Actions tab, plus GitHub's own email to the
# account the schedule runs under when a scheduled workflow fails. That is the
# whole of it. There is no page, no channel and no on-call.
#
# SIMULATION_HARNESS section 7.2 asks for more and does not have it: "a failed
# band pages the same channel a nightly batch failure does". That channel does
# not exist in this repository. The report says so on every run rather than
# leaving a reader to infer that a green check means somebody is watching.
#
# AND THE DEAD-MAN SWITCH IS THE HALF THAT IS MISSING, NOT THE ALERT.
# CRON_INVENTORY already carries this job's row -- "Simulation harness |
# nightly | expected by 10:00 CT | run absent | S3" -- under a rule stated in
# its own first line: "a job in this table without a dead-man switch is a job
# that does not exist." Nothing here implements alerting on NON-RUN, and
# GitHub disables scheduled workflows in a repository with 60 days of no
# activity, which is exactly the "stops being scheduled" failure that register
# was written for: no error, no alert, and a number that quietly stops moving.
# Closing it means a check-in from outside the estate, which is CRON_INVENTORY's
# own ruling and is not a thing a workflow file can do for itself.
#
# -----------------------------------------------------------------------------
# THE SCHEDULE, AND WHY IT IS NOT AT THE TOP OF AN HOUR
# -----------------------------------------------------------------------------
# CRON_INVENTORY expects the simulation harness by 10:00 CT, which is 15:00 UTC
# under CDT and 16:00 UTC under CST. GitHub's scheduler is UTC only, has no
# timezone, and DELAYS scheduled runs under load, dropping them entirely at the
# busiest minutes. `20 8 * * *` is 03:20 CT under CDT and 02:20 CST, which
# leaves at least six hours of margin under either offset, and :20 rather than
# :00 because the top of the hour is the most contended minute on the platform.
#
# `workflow_dispatch` IS A REQUIREMENT AND NOT A CONVENIENCE. SIMULATION_HARNESS
# section 7.2: "money-path diffs run it out of band, before the change is
# considered done rather than the next morning" (STRATEGY section 5). The seed
# is an input for the other half of that paragraph: "the run is reproducible
# from a recorded seed, and the seed is written into the report so a failure can
# be re-run exactly rather than approximately."
#
# -----------------------------------------------------------------------------
# IT DOES NOT RUN ON PUSH, AND THAT IS SECTION 7.2 RATHER THAN A COST DECISION
# -----------------------------------------------------------------------------
# "Not a merge blocker: a 10,000-trader Monte Carlo is not a pull-request-latency
# operation, and its failures need a human to classify as a regression or a
# drift." A stage that blocked merge on a drift nobody had classified is a stage
# that gets bypassed with a flag, which STRATEGY section 1 is the argument
# against. It is nonetheless a BLOCKING job in its own right: the runner exits
# non-zero on a finding and nothing here is advisory.

on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run seed. Take it from the report of the run being reproduced.'
        required: false
        default: 'ci-09-nightly-001'
      trials:
        description: 'Accounts simulated. SIMULATION_HARNESS section 1 says 10,000.'
        required: false
        default: '10000'
      sessions:
        description: 'Trading sessions in the window. 252 is a weekday year.'
        required: false
        default: '252'

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  # CI-09  Nightly, the simulation-harness leg
  # ===========================================================================
  simulation-harness:
    name: CI-09 nightly simulation harness
    runs-on: ubuntu-latest
    # A NIGHTLY THAT HANGS IS A NIGHTLY NOBODY CANCELS. The default job timeout
    # is six hours and the observed run is seconds of compute behind an install;
    # ci.yml's CI-05 comment makes the same call for the same reason. Twenty
    # minutes is roughly two orders of magnitude above the good case, which is
    # the margin an install and a cold runner need.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # RIDER 3, OQ-P1-03. `.nvmrc` is the only place the Node version is
          # written, and RI-05 fails any workflow that pins it inline.
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # INSTALL IS THE FIRST STEP OF THE JOB AND NOT AN ASSUMPTION.
      # `packages/harness` is a workspace package that resolves `@merit/rithmic`
      # and `@merit/rules-engine` through pnpm's links, and a runner without them
      # reads as the harness being broken rather than as an install that did not
      # happen. Frozen for VG-12's reason, which is every other job's: an install
      # allowed to update the lockfile is an install testing a tree that is not
      # the tree under review.
      - name: Install, frozen
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # The run
      # -----------------------------------------------------------------------
      # The defaults live in the runner rather than here, so a person running it
      # on a laptop gets the same run CI does. The `||` fallbacks are for the
      # scheduled event, where `inputs` is empty.
      - name: CI-09 simulation harness
        run: |
          node scripts/ci/nightly-harness.mjs \
            --seed "${{ github.event.inputs.seed || 'ci-09-nightly-001' }}" \
            --trials "${{ github.event.inputs.trials || '10000' }}" \
            --sessions "${{ github.event.inputs.sessions || '252' }}"

      # THE GUARD IS "THERE IS A REPORT", NOT "THE JOB IS PASSING". The run whose
      # report is most worth keeping is the one that went red, and `always()`
      # alone would turn a crashed runner into a SECOND red step complaining
      # about a file that could not exist. ci.yml's SBOM step learned that on
      # this repository's first CI run.
      - name: Keep the report
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-09-nightly
          path: test-results/
          if-no-files-found: error
          # Long enough for the C8 monthly retro to reach the run that produced
          # a figure it is reading (HO-01's second consumer), and no longer: the
          # report is an aggregate and the marks are never written anywhere.
          retention-days: 45

      # -----------------------------------------------------------------------
      # The stage proves itself failing, in its own job
      # -----------------------------------------------------------------------
      # ci.yml's rule, inherited: "a stage cannot be green while the proof that
      # it can fail lives somewhere a person deleted." It matters more here than
      # there. A merge blocker that quietly stops asserting is caught by the next
      # pull request that should have been stopped; a NIGHTLY that quietly stops
      # asserting is green forever and nobody is looking.
      #
      # The two CI-09 cases seed the two findings this job exists to produce: a
      # run that simulated nothing, and INV-17's bound moved by one cent. Both
      # run at a small scale, because what they prove is the shape of the
      # failure and not the size of the run.
      - name: Gates are falsifiable
        run: node scripts/ci/falsify-ci.mjs CI-09

  # ===========================================================================
  # CI-09  Nightly, the replay self-audit leg
  # ===========================================================================
  # BUILT 2026-08-27, ON THE ARTIFACT ADR-119 RULED. This is the leg that turned
  # `CI-06/gate-inventory` red the day `scripts/demo/world.ts` landed, which is
  # ADR-073 section 2 (b) working: "the day it arrives the row is a finding until
  # the stage is written". This job is that stage, so the finding closes.
  #
  # IT IS A SEPARATE JOB AND NOT A STEP IN THE HARNESS JOB. ADR-073 rules each of
  # CI-09's four legs separately, and a leg folded into another job cannot go red
  # on its own or be read on its own. The two absent legs stay absent rather than
  # becoming `if: false` steps, for the reason the header gives.
  replay-self-audit:
    name: CI-09 nightly replay self-audit
    runs-on: ubuntu-latest
    # The harness leg's reasoning, unchanged: the observed run is seconds of
    # compute behind an install, and a nightly that hangs is one nobody cancels.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # RIDER 3, OQ-P1-03, and RI-05 fails any workflow that pins inline.
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Install, frozen
        run: pnpm install --frozen-lockfile

      # THE RUNNER IS THE `.mjs` ENTRY AND IT STAYS THERE. The earlier note here
      # said this line should move to `seed-world.ts` once the specifier sweep
      # landed. The sweep landed (ADR-121, session 233) and the line does not
      # move, because the sweep was never the reason for the `.mjs` entry.
      #
      # MEASURED AFTER THE SWEEP: `node --experimental-strip-types
      # scripts/demo/seed-world.ts` exits 0 and writes ZERO BYTES. That file
      # exports `main` and never invokes it; `seed-world.mjs` is what registers
      # the resolve hook, wires argv and stdio, calls `main` and returns its exit
      # code. Moving this line would trade a self-audit that reports for a
      # module-graph load that cannot, and it would go GREEN doing it. FM-17 is
      # that exact shape: an audit that declines to report must never look like
      # one that found nothing.
      #
      # WHAT THE SWEEP DID BUY IS COVERED WHERE IT BELONGS. `RI-10` now reaches
      # `scripts/`, so a specifier naming a file that is not there turns CI-01
      # red rather than waiting for this job to die at startup.
      #
      # The runner refuses on `accountsAudited === 0`, so an empty world fails
      # this job rather than passing it quietly. That is the whole reason the
      # leg could not be written before the world existed.
      - name: CI-09 replay self-audit over the demo world
        run: node scripts/demo/seed-world.mjs

      # The harness leg's guard, for its reason: the report worth keeping is the
      # one from the run that went red, and `always()` alone turns a crashed
      # runner into a second red step about a file that could not exist.
      - name: Keep the report
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-09-replay-self-audit
          path: test-results/
          if-no-files-found: error

  # ===========================================================================
  # CI-09  Nightly, the Stryker leg
  # ===========================================================================
  # BUILT 2026-08-27, ON THE ARTIFACT ADR-127 RECORDS. This leg waited from
  # 2026-08-20 on ONE artifact and the artifact was not a file: "the VG-12
  # admission, which a session cannot grant itself". `gates.mjs` registered it
  # as unprobeable in session 23's words, "a job can see the dependency surface
  # changed and cannot see that a human agreed", so no check in this repository
  # could ever have reported its arrival. THE FOUNDER DELEGATED THE GRANT and
  # ADR-127 RECORDS the delegation rather than proceeding as though the gate did
  # not apply, which is ADR-116's shape one leg over. An admission taken
  # silently and a gate ignored are the same diff and opposite records.
  #
  # IT IS A SEPARATE JOB, for the reason the replay leg's header gives: ADR-073
  # rules each of CI-09's four legs separately, and a leg folded into another job
  # can neither go red on its own nor be read on its own. The fourth leg, the
  # detector canary, stays ABSENT rather than becoming an `if: false` step.
  #
  # ---------------------------------------------------------------------------
  # WHAT THIS JOB FAILS ON, WHICH IS NOT THE SCORE
  # ---------------------------------------------------------------------------
  # `stryker.conf.mjs` sets `thresholds.break` to null, so NO mutation score
  # fails this job. That is STRATEGY section 2 verbatim -- "reported as a trend
  # rather than a threshold" -- and OQ-TS-02's answer: "A threshold on a young
  # codebase produces tests written to kill mutants rather than to pin behavior,
  # which is TR-01 inverted." A break threshold is the cheapest way to violate
  # TR-01, because the cheapest way to move a mutation score is to write a test
  # that pins whatever the implementation currently does.
  #
  # SO THE THREE THINGS IT DOES FAIL ON ARE WORTH NAMING. The initial test run
  # failing. The runner crashing. And ZERO MUTANTS, which Stryker refuses itself
  # ("No tests were executed. Stryker will exit prematurely") and which was
  # watched firing before this job was written, with `--mutate` pointed at a path
  # that does not exist. THAT THIRD ONE IS THIS FILE'S OWN LESSON in a different
  # costume: the replay leg's runner note two jobs up is about a `.ts` entry that
  # exits 0 writing zero bytes. A mutation run whose glob matches nothing has the
  # same shape and would go green over nothing.
  #
  # ---------------------------------------------------------------------------
  # THE TIMEOUT IS A MEASUREMENT AND NOT A ROUND NUMBER
  # ---------------------------------------------------------------------------
  # The other two legs are seconds of compute behind an install and carry 20
  # minutes. THIS ONE IS NOT, and the number below is a measurement rather than a
  # round figure. Measured on this branch on a 4-core host, which is the core
  # count `ubuntu-latest` gives: 1,921 mutants over 19 source files in
  # 28 minutes 31 seconds of wall clock and 105 minutes of CPU. ADR-127 section 5
  # carries the score.
  #
  # 90 IS THAT MEASUREMENT WITH ROOM FOR A COLD AND SHARED RUNNER, roughly three
  # times the observed run. It is a bound on a job that HANGS and not a budget
  # the run is expected to approach: the default job timeout is six hours, and a
  # nightly that hangs is a nightly nobody cancels. A run that starts taking 80
  # minutes is a signal to read rather than a number to raise.
  stryker-mutation:
    name: CI-09 nightly Stryker on the rules engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # RIDER 3, OQ-P1-03, and RI-05 fails any workflow that pins inline.
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Install, frozen
        run: pnpm install --frozen-lockfile

      # THE FILTER IS THE SCOPE AND IT IS NOT DECORATION. STRATEGY section 2
      # rules mutation testing "on `packages/rules-engine` only", and this line
      # plus the config living inside that package are the two halves of it. A
      # root-level `stryker run` over this workspace is the wall-clock disaster
      # the rejected alternative in that row names by hand.
      - name: CI-09 Stryker on the rules engine
        run: pnpm --filter @merit/rules-engine run mutation

      # A TREND NOBODY CAN READ WITHOUT DOWNLOADING AN ARTIFACT IS NOT A TREND.
      # STRATEGY asks for a number reported nightly, and the run page is where a
      # nightly is read, so the score goes to the step summary. `always()`
      # because the run that is most worth reading is the one that went red, and
      # the report exists for a red run too.
      - name: Report the score
        if: always() && hashFiles('packages/rules-engine/test-results/stryker/mutation.json') != ''
        run: |
          cat > "$RUNNER_TEMP/ci-09-score.mjs" <<'EOF'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(
            readFileSync('packages/rules-engine/test-results/stryker/mutation.json', 'utf8'),
          );
          // The mutation score counts DETECTED over VALID, which is the
          // mutation-testing-elements definition: Ignored and CompileError
          // mutants are not valid and are in neither half. Reproducing the
          // arithmetic here rather than reading a field keeps the summary
          // honest about which mutants it counted.
          const tally = (mutants) => {
            const t = { Killed: 0, Timeout: 0, Survived: 0, NoCoverage: 0, RuntimeError: 0, CompileError: 0, Ignored: 0 };
            for (const m of mutants) t[m.status] = (t[m.status] ?? 0) + 1;
            return t;
          };
          const rows = Object.entries(report.files).map(([path, f]) => [path, tally(f.mutants)]);
          const total = tally(Object.values(report.files).flatMap((f) => f.mutants));
          const score = (t) => {
            const detected = t.Killed + t.Timeout;
            const valid = detected + t.Survived + t.NoCoverage;
            return valid === 0 ? 'n/a' : `${((detected / valid) * 100).toFixed(2)}%`;
          };
          console.log('## CI-09 Stryker, `packages/rules-engine`');
          console.log('');
          console.log('**A TREND AND NOT A THRESHOLD.** STRATEGY section 2 and OQ-TS-02: no score fails this job.');
          console.log('');
          console.log('| File | Score | Killed | Timeout | Survived | No coverage |');
          console.log('|---|---|---|---|---|---|');
          for (const [path, t] of rows.sort((a, b) => a[0].localeCompare(b[0]))) {
            console.log(`| \`${path}\` | ${score(t)} | ${t.Killed} | ${t.Timeout} | ${t.Survived} | ${t.NoCoverage} |`);
          }
          console.log(`| **all files** | **${score(total)}** | **${total.Killed}** | **${total.Timeout}** | **${total.Survived}** | **${total.NoCoverage}** |`);
          EOF
          # THE SCRIPT IS A FILE AND NOT A HEREDOC INTO `node`. Node decides
          # module kind from the extension, and a script arriving on stdin has
          # none: an `import` statement there is a syntax error under CommonJS
          # and the step would fail on the summary rather than on the run.
          node "$RUNNER_TEMP/ci-09-score.mjs" >> "$GITHUB_STEP_SUMMARY"

      # The harness leg's guard, for its reason: the report worth keeping is the
      # one from the run that went red, and `always()` alone turns a crashed
      # runner into a second red step about a file that could not exist. The
      # path is the PACKAGE's `test-results/` and not the repository root's,
      # because the run is scoped to the package and so is its output.
      - name: Keep the report
        if: always() && hashFiles('packages/rules-engine/test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-09-stryker
          path: packages/rules-engine/test-results/
          if-no-files-found: error
          # The harness leg's retention, for the harness leg's reason: long
          # enough for the C8 monthly retro to reach the run that produced a
          # figure it is reading.
          retention-days: 45

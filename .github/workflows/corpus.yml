name: corpus

# CI-06, corpus integrity. Constitution C10: a gate that lives in a document is
# a gate somebody remembers; a gate that lives in CI is a gate.
#
# VERIFIED against PostgreSQL 16 on 2026-08-15 before first push, rather than
# shipped and hoped for: the migrations apply forward-only from empty; a
# re-apply is rejected; and all three ledger probes fire for the right reason
# (checked by message, not by exception class).
#
# THE OBJECT COUNTS ARE NOT REPEATED HERE, and that is deliberate. They read
# "96 tables, 326 indexes, 347 check constraints and 6 triggers" until
# 2026-08-16, when 0030 and 0031 made three of the four wrong in a comment
# nobody reads while the job that emits them stayed correct.
#
# AND THEN THE REPLACEMENT DRIFTED TOO, INSIDE THE COMMENT THAT DOCUMENTS THE
# DRIFT. The fix restated "30 files and 97 / 331 / 351 / 6" one sentence after
# declaring the counts would not be repeated here; 0032 landed the same day and
# made every one of those figures wrong again. A count in a comment has now
# been found wrong twice in one file on one day, which is CI-06g's whole thesis
# arriving by demonstration. No figures are stated here at all. The job below
# derives them from the database and prints them on every run, and
# DELTA_MANIFEST records them dated, once, where a gate can reach them.
#
# Every check here exists because the thing it checks ALREADY DRIFTED once:
#   CI-06a  59 links broke silently before a human found them
#   CI-06d  registry counts were quoted in gate summaries while wrong
#   CI-06f  two pull requests claimed ADR-031 from the same base
#   CI-06g  every hand-maintained count checked has been found wrong
#   CI-06h  the migration set's own object counts were stated and wrong
#   ADR-026 the delta tally was wrong on the day it was written

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI-06a..g plus the ADR-026 manifest gate. Pure Node, no services, fast.
  # ---------------------------------------------------------------------------
  integrity:
    name: CI-06 corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI-06f compares this branch's ADR headings against main's. A shallow
          # clone has no main to compare with, and the gate would pass by being
          # unable to look.
          fetch-depth: 0

      # RIDER 3, OQ-P1-03. `.nvmrc` is the only place the Node version is
      # written. This step used to carry `node-version: '22'`, which made two
      # files hold one number with nothing reconciling them: a hand-maintained
      # count in a different costume, and it drifts the same way. RI-05 in
      # packages/tooling asserts no workflow pins the version inline.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run corpus gates
        run: node scripts/corpus/gates.mjs check

      # RIDER 1. THE GATES ARE PROVEN FALSIFIABLE AS OF ONE SESSION AND NOTHING
      # KEPT THEM SO. A gate nobody has watched fail is not a gate
      # (STRATEGY section 4.4), and the step above only ever watches them pass:
      # a gate silently narrowed until it reads nothing reports PASS in exactly
      # the same way as a gate that is working.
      #
      # falsify.mjs runs every gate twice, once against this tree where it must
      # pass and once against a copy carrying one seeded violation aimed at it
      # where it must fail ON THAT FINDING rather than merely exit non-zero, and
      # then runs the scope cases that assert each gate reads the right set of
      # files. It runs BEFORE the regeneration step below, which rewrites spans
      # in the working tree that falsify.mjs copies.
      - name: Gates are falsifiable
        run: node scripts/corpus/falsify.mjs

      # ADR-042's SECOND MECHANISM, and it needs no database because it is a
      # check on the SHAPE of the DDL rather than on anything installed: no
      # `interval` arithmetic against a `date` column, and no `timestamptz` cast
      # to `date`.
      #
      # IT IS VACUOUSLY TRUE TODAY, which is the argument for wiring it now
      # rather than against it. `0029` to `0031` made `interval '48 hours'`
      # idiomatic on the money path, so the next session that needs "five
      # trading days from now" has a working pattern sitting right there that
      # produces a wrong answer on roughly 104 days a year and reads as though
      # somebody thought about it.
      #
      # `--falsify` runs FIRST and is not decoration: this check has no natural
      # failures to observe, so the only evidence it works is watching it fire
      # on each seeded violation and leave four legitimate constructs alone,
      # including `interval '48 hours'` against a `timestamptz`, which is the
      # ruled unit and must never be a finding.
      - name: The date-unit shape check is falsifiable
        run: node scripts/db/assert_date_unit_shape.mjs --falsify

      - name: No interval arithmetic against a date column
        run: node scripts/db/assert_date_unit_shape.mjs

      # CI-06g is only meaningful if regenerating changes nothing. The check
      # above compares spans against their queries; this proves the generator
      # is the thing that wrote them, so a span cannot be hand-edited into
      # agreement with a stale query.
      - name: Generated spans are reproducible
        run: |
          node scripts/corpus/gates.mjs generate
          if ! git diff --quiet; then
            echo "::error::Regenerating spans changed the tree. A count in a document is stale."
            git --no-pager diff
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # CI-06h. The migration set installs from empty, and the object counts the
  # corpus states are derived FROM THE DATABASE rather than from a grep.
  # ---------------------------------------------------------------------------
  migrations:
    name: CI-06h migration install and object counts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: merit
          POSTGRES_DB: merit_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: merit
      PGDATABASE: merit_ci

    steps:
      - uses: actions/checkout@v4

      # OI-03's assertion is a .mjs, because the item's own word is "against the
      # DOCUMENT" and a .sql file cannot read markdown. This job had no Node
      # before that step existed.
      #
      # `.nvmrc` is the only place the Node version is written (RIDER 3,
      # OQ-P1-03), and RI-05 in packages/tooling asserts that no workflow pins it
      # inline. The integrity job above reads it the same way.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 1. Forward-only apply from empty, in order, zero errors.
      #    ON_ERROR_STOP is the whole point: psql's default is to continue past
      #    a failed statement and exit 0, which would report a green install of
      #    a schema that is missing tables.
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in packages/db/migrations/*.sql; do
            echo "-- applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # 2. A second apply of the whole set MUST fail. This proves no migration
      #    is accidentally idempotent-by-rerun, which would mean it is not
      #    actually creating what it claims to create.
      - name: Re-applying the set fails
        run: |
          set -uo pipefail
          if psql -v ON_ERROR_STOP=1 -q -f packages/db/migrations/0001_extensions_and_enums.sql 2>/dev/null; then
            echo "::error::0001 re-applied cleanly. A migration that is idempotent by rerun is not creating what it claims."
            exit 1
          fi
          echo "Re-apply correctly rejected."

      # 3. The object counts, derived from the database. These are the two
      #    numbers a grep of the DDL gets wrong by a third, because Postgres
      #    backs every primary key and unique constraint with an index.
      - name: Derive object counts
        run: |
          set -euo pipefail
          psql -At -c "
            select 'tables=' || count(*) from pg_tables where schemaname='public'
            union all
            select 'indexes=' || count(*) from pg_indexes where schemaname='public'
            union all
            select 'checks=' || count(*) from pg_constraint c
              join pg_namespace n on n.oid=c.connamespace
              where n.nspname='public' and c.contype='c'
            union all
            select 'triggers=' || count(*) from pg_trigger t
              join pg_class cl on cl.oid=t.tgrelid
              join pg_namespace n on n.oid=cl.relnamespace
              where n.nspname='public' and not t.tgisinternal
          " | tee object_counts.txt

      # 4. The counts the corpus DOES state must match the database.
      #    sql_tables and sql_triggers are generated spans; this is the check
      #    that the grep-derived span agrees with the installed truth.
      - name: Spanned counts agree with the database
        run: |
          set -euo pipefail
          db_tables=$(grep '^tables=' object_counts.txt | cut -d= -f2)
          db_trigs=$(grep '^triggers=' object_counts.txt | cut -d= -f2)
          # grep -o | wc -l rather than grep -c | bc: grep exits 1 when NO file
          # matches, which under set -e aborts the step with a confusing error
          # instead of reporting zero. wc always exits 0.
          sql_tables=$(grep -hoE '^CREATE TABLE ' packages/db/migrations/*.sql | wc -l)
          sql_trigs=$(grep -hoE '^CREATE (CONSTRAINT )?TRIGGER ' packages/db/migrations/*.sql | wc -l)
          fail=0
          [ "$db_tables" = "$sql_tables" ] || { echo "::error::tables: DDL says $sql_tables, database says $db_tables"; fail=1; }
          [ "$db_trigs" = "$sql_trigs" ] || { echo "::error::triggers: DDL says $sql_trigs, database says $db_trigs"; fail=1; }
          exit $fail

      # OI-08. NO-FLOATS, ASSERTED WHERE IT CAN SEE THE WHOLE SCHEMA.
      #
      # The assertion was written as a DO block inside 0027, so it reads
      # information_schema AS OF 0027. That was true the day it was written and
      # false the day 0028 landed. By 0032 there were FIVE MIGRATIONS OUTSIDE
      # THE GUARD THE CORPUS BELIEVED PROTECTED EVERY MONEY COLUMN, and a later
      # migration adding a numeric money column would have sailed past it.
      # Nothing failed; the guard was simply not looking, which is why this was
      # found by hand rather than by CI.
      #
      # Here it runs after every migration has applied, so it is positionally
      # last BY CONSTRUCTION rather than by whoever remembers to move it. A
      # migration numbered 0099 is inside this guard on the day it is written.
      #
      # 0027's copy is deliberately NOT deleted: migrations are sacred, once
      # merged never edited, only superseded (constitution E2). It still passes
      # and it is now a historical assertion about the schema at 0027.
      #
      # THE FILE FALSIFIES ITSELF, one seeded violation per direction, because
      # an assertion only ever run against a schema that satisfies it reports
      # PASS in exactly the same way as one narrowed until it reads nothing.
      - name: NO-FLOATS holds over the whole applied schema (OI-08)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/assert_no_floats.sql

      # 5. The ledger constraints that carry rulings, probed against the real
      #    database. Each is one perturbation. A constraint nobody has seen
      #    reject anything is a constraint nobody knows is wired up.
      - name: Probe ADR-027's ledger constraints
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_ledger_constraints.sql

      # RIDER 2. ADR-035's guard, verified by nothing since the session that
      # fixed it. `assert_published_plan_version_immutable()` read `NEW.config`
      # on a table whose rule contract is `rules`; PL/pgSQL resolves record
      # fields at execution rather than at CREATE FUNCTION, so the migration
      # installed cleanly, every existing probe passed, and the function was
      # wrong only when it fired. It fired on the one transition the design
      # permits and no plan version could be retired.
      #
      # A PROBE THAT SHIPS BESIDE A FIX AND NEVER RUNS AGAIN IS THE SAME OBJECT
      # AS THE GOLDEN TEST THAT WAS MISSING. This job ran only the ledger probe
      # until now.
      - name: Probe ADR-035's plan-version immutability guard
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_plan_version_immutability.sql

      # 7. ADR-040 and ADR-041, the payout enforcement window and the identity
      # restriction episode, probed against the real database.
      #
      # ELEVEN ASSERTIONS AND THE FIRST SIX ARE SUCCESSES. Section 13 of the
      # delta manifest is why: every probe that only ever attempts a forbidden
      # thing passes against a guard that rejects everything, so the successes
      # come first and the rejections come after them.
      #
      # This probe also covers the one defect this fold inherited rather than
      # introduced: 0011 gave wallet_withdrawals a freeze clock, a freeze flag
      # and an expiry index while wallet_withdrawal_status has no frozen value,
      # so THE HALT WAS REPRESENTABLE AND ENTIRELY UNENFORCED. 0031 is the
      # enforcement and REJECTION 3 is what watches it fire.
      - name: Probe ADR-040 and ADR-041's payout hold and restriction episode
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_payout_hold.sql

      # 8. ADR-039, phone identity and passwordless auth. OI-07.
      #
      # FOLD-01 session 3 executed forty-eight assertions against 0029 and
      # COMMITTED NONE OF THEM. They were watched passing once and then existed
      # only as a table in DELTA_MANIFEST section 14, which is the exact object
      # section 13 names: a probe that ships beside a fix and never runs again
      # is the same thing as the golden test that was missing.
      #
      # IT LEADS WITH THE SUCCESS CASE, and on this migration that is not a
      # stylistic preference. 0029's central ruling is something the database
      # must NOT do: ADR-039 splits the hard link in two and leaves
      # phone -> identity deliberately unconstrained, so a SECOND IDENTITY
      # VERIFYING A LIVE NUMBER MUST COMPLETE and raise the flag. An absence is
      # invisible in a diff, and "completing the pair" with a unique index on
      # phone_hash looks like tightening a constraint while actually refusing
      # the innocent owner of a recycled number at the door, before the
      # portability check that exists to rescue them can run (amendment 3).
      # SUCCESS 2 is what fails the day somebody does it.
      #
      # Rejections are checked by THE CONSTRAINT THAT FIRED, read out of GET
      # STACKED DIAGNOSTICS, never by exception class: before 0028 a retirement
      # raised undefined_column and a handler catching "any error" scored that
      # as the constraint working.
      - name: Probe ADR-039's phone identity and auth (OI-07)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_phone_identity.sql

      # 9. ADR-045, the calendar prior-image guards installed by 0033. OI-06.
      #
      # IT FORCES THE DEFERRED CHECK INSTEAD OF WAITING FOR A COMMIT THAT NEVER
      # COMES. CALENDAR-C1 is a deferrable constraint trigger and the probe ends
      # in ROLLBACK like every other probe here, so its four success cases would
      # otherwise be checked by nothing at all: the file would print four green
      # successes having verified none of them, which is the vacuous-pass shape
      # this corpus has now found in a CHECK, in a DO block and in a falsify
      # seed. `SET CONSTRAINTS ... IMMEDIATE` applies the pending checks
      # retroactively, and every assertion in the file runs because of it.
      #
      # Rejections are checked BY MESSAGE. Both halves of CALENDAR-C1 raise
      # check_violation, so a handler catching the class cannot tell "no prior
      # image" from "the count is wrong", and the counted half could be deleted
      # with every rejection still passing.
      - name: Probe ADR-045's calendar prior-image guards (OI-06)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_calendar_revision_required.sql

      # 10. ADR-046, the reversible contact addresses and the dispatcher role
      # installed by 0034. OQ-M10-06.
      #
      # HALF OF WHAT THIS ONE PROVES IS A GRANT, WHICH NO OTHER PROBE IN THIS
      # JOB TOUCHES. The founder's amendment to ADR-046 is that the sending path
      # gets SELECT, INSERT and a rotation UPDATE and NEVER DELETE, and a
      # migration that grants DELETE by accident installs cleanly, satisfies
      # every constraint in the file, and is wrong in the exact way the
      # amendment exists to prevent. So the assertions `SET LOCAL ROLE
      # merit_dispatcher` and attempt the write, because a catalogue query
      # proves what was written and an attempted write proves what the database
      # will do.
      #
      # IT LEADS WITH ERASURE, and that is the assertion to read. Withholding
      # DELETE is only defensible if erasure is expressible WITHOUT it, so S4
      # clears the three sealed columns and then checks that the value_hash
      # INV-M16-03 matches on is still there. A NOT NULL on any of the three
      # would have made DELETE the only way to erase, on the tables that no
      # longer have it.
      - name: Probe ADR-046's reversible addresses and dispatcher grants (OQ-M10-06)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_reversible_contact_addresses.sql

      # 11. ADR-047, the calendar revision on rule_states installed by 0035.
      # OQ-P2-02, and the other half of 0033.
      #
      # SIX SUCCESSES BEFORE THE FIRST REJECTION, because on this migration the
      # dangerous edit is a TIGHTENING and only a success case can see one.
      # `calendar_revision_id` is nullable: NULL means the fold read a calendar
      # that had never been corrected, which is every row the engine writes
      # until the first correction lands. A NOT NULL looks like completing the
      # pair, installs cleanly, satisfies all four rejections, and stops the
      # engine dead. SUCCESS 1 is what fails the day somebody adds it, and
      # SUCCESS 4 is what fails the day somebody forces the stamp to equal the
      # current maximum, which would make a row claim a calendar it never read.
      #
      # SUCCESS 5 ASSERTS A NON-CORRESPONDENCE, which is unusual enough to say
      # out loud: it walks from a rule state for one day to the prior image of a
      # DIFFERENT day and requires them to differ. The column is a watermark
      # over the whole calendar, not a pointer to this row's own correction, and
      # a per-day reading would scope replay to the corrected day and miss every
      # downstream counter. That reading is the one the column name invites.
      #
      # SUCCESS 6 REACHES THE ONE THING NO CONSTRAINT CAN. ADR-047's central
      # ruling is that this column is EXCLUDED from state_hash, the hash is
      # computed by an engine that does not exist yet, and the only
      # machine-readable record of the input set is the column comment 0015 put
      # it in (ADR-026 C-07). Both halves are asserted, because a comment that
      # added the column to the HASHED list would satisfy a presence check while
      # inverting the ruling.
      - name: Probe ADR-047's calendar revision on rule_states (OQ-P2-02)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_rule_states_calendar_revision.sql

      # EC-157, RULED REPAIR A. THIS PROBE LEADS WITH THREE SUCCESS CASES AND
      # THAT IS THE WHOLE POINT OF IT.
      #
      # The defect it guards was a CONSTRAINT REFUSING A LEGITIMATE ROW:
      # `daily_marks_balance_arithmetic` added the adjustment a second time,
      # inside the day, so the mark for EVERY SETTLED PAYOUT was unwritable as
      # specified. An inventory of rejections passed against it for twenty-two
      # migrations, because every mark in the repository carries a zero
      # adjustment and at zero the constraint and both M01 identities agree.
      #
      # REJECTION 2 asserts from the CATALOGUE that the retired name is gone
      # rather than merely quiet. `0036` drops it rather than redefining it, so
      # a reader who greps `daily_marks_balance_arithmetic` finds nothing
      # instead of finding a statement whose meaning changed underneath them.
      - name: Probe EC-157's mark identities (Repair A, 0036)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_daily_marks_identities.sql

      # ADR-053. FIVE SUCCESS CASES BEFORE THE FIRST REJECTION, and on this
      # migration that is the whole point of the file.
      #
      # The defect it guards was a CONSTRAINT REFUSING A LEGITIMATE ROW:
      # `rule_states_high_water_bounds_balance` asserted `hwb >= balance`
      # unconditionally while R-15 freezes `hwb` permanently at the floor lock,
      # so the state row of EVERY LOCKED ACCOUNT THAT THEN MADE A NEW CLOSING
      # HIGH was unwritable, which is every account that passes an evaluation.
      # SUCCESS 1 is GS-016's expected end state verbatim, and it is what fails
      # the day somebody re-tightens the bound.
      #
      # SUCCESS 4 AND 5 ARE THE SAME ROW UNDER BOTH READINGS OF AN OPEN FOUNDER
      # ITEM. Whether the R-31 funded reset clears the lock is unruled, and
      # ADR-053 claims to be correct either way; those two cases are what make
      # the claim testable. They are also what would fail if somebody replaced
      # this constraint with a cross-row freeze trigger, because R-31 resets
      # `hwb` DOWNWARD to `size_cents` and on Core EOD every eval pass is also a
      # lock day.
      #
      # REJECTION 3 IS THE ASSERTION THAT LOOKS MISPLACED AND IS NOT. A CHECK
      # THAT EVALUATES TO NULL PASSES. This predicate is two-valued only because
      # floor_locked, high_water_balance_cents and balance_cents are all NOT
      # NULL, and it names none of them; drop one later and the constraint
      # admits everything with its text unchanged and every rejection here still
      # passing. The NOT NULLs are asserted from the catalogue for that reason.
      - name: Probe ADR-053's scoped high-water bound (0037)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_rule_states_high_water_bound.sql

      # ADR-068's IMPERSONATION-C1, C2 and C3 (0042). AUTH, MONEY PATH.
      #
      # FIVE SUCCESS CASES BEFORE THE FIRST REJECTION, and on this file the
      # success half is doing more work than usual. IMPERSONATION-C1 is a
      # CROSS-TABLE EXISTS in a trigger body, and the two ways to get it wrong
      # are both invisible to an inventory of refusals: a body that raises
      # unconditionally, and a mirror pointed at the wrong column. Either would
      # pass every rejection below AND TAKE THE TRADER AUTH PATH DOWN WITH IT,
      # which is why S5 opens an ordinary trader session and asserts it worked.
      # 0034 is the precedent: it had no success case on identity_phones, so a
      # CHECK reading `phone_ciphertext IS NULL` passed thirty-two assertions
      # and reported nothing.
      #
      # REJECTION 2 IS THE ONE THE FILE EXISTS FOR. A guard only on
      # impersonation_sessions is satisfied by writing the sessions row SECOND,
      # and REJECTION 1 still passes while that hole is open. Watched failing:
      # with the mirror dropped, R1 passes and R2 fails, which is the seeded
      # violation recorded in DELTA_MANIFEST section 21.
      #
      # REJECTION 5 PINS `LEAST(expires_at, COALESCE(ended_at, expires_at))`
      # against the naive `expires_at`. A bound written the naive way passes
      # REJECTION 4 and admits a page view recorded after an explicit exit,
      # which is a view of a trader's account after the session ended, recorded
      # as though the session were live. Also watched failing.
      - name: Probe ADR-068's impersonation session boundary (0042)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_impersonation_session_type.sql

      # 0045, SD-M21-01 and SD-M21-02. SUCCESSES LEAD, because 0034's guard
      # rejected everything and passed thirty-two rejection assertions doing it.
      #
      # SUCCESS 1 IS THE ONE THAT CANNOT BE WRITTEN AS A COMMENT. calibrationDigest()
      # returns HEX and calibration_digest is bytea, so the probe writes a row
      # through the real decode with an actual producer output. REJECTION 7 is
      # its mirror: the same string stored undecoded is 64 bytes and is refused.
      #
      # REJECTION 3 pins the blank-waiver floor as a SEPARATE named constraint.
      # num_nonnulls counts '' as present, so without it a waiver of '' would
      # satisfy "exactly one" while recording nothing at all.
      - name: Probe M21's publish-decision record (0045)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_simulation_decision_record.sql

      # ADR-079, MONEY PATH. 0015 bounded consistency_period_start_day against
      # the row's own trading_day; R-47 defines it against the ANCHOR and sets
      # it to the next trading day AFTER that anchor, so EVERY EVAL-PASS ROW WAS
      # UNWRITABLE. Executed at 0045 before the repair was written.
      #
      # SUCCESS 1 IS THE ROW 0015 REFUSED and it proves the constraint SILENT
      # rather than permitting: on the eval-pass row payout_anchor_day IS NULL,
      # so the replacement does not reach it. REJECTION 1 AND 2 ARE THE STEP
      # THAT MATTERS. They are the boundary either side of R-47's "strictly",
      # they are the only cases in this job that watch the new constraint refuse
      # anything at all, and each asserts the CONSTRAINT NAME rather than a bare
      # check_violation, which any constraint on the table would satisfy.
      - name: Probe ADR-079's anchor-relative consistency period (0046)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_consistency_period_after_anchor.sql

      # 0047, ADR-087, OI-29. MONEY PATH. The FK on plan_versions proves a
      # simulation run was NAMED; nothing proved what it says, because a CHECK
      # cannot read another table. Two of DELTA_MANIFEST's three unsound publish
      # states close here and the third does not: `rules_digest` has no producer
      # in the tree, so there is nothing for a digest comparison to agree with.
      #
      # SUCCESSES LEAD, and every one of them also passes at 0046: they are the
      # shapes that did NOT change. SUCCESS 3 asserts the SURVIVING HOLE, a run
      # anchored to no version deciding any publish, so the day somebody closes
      # it the probe says what they broke.
      #
      # CASES `0045 A` AND `0045 B` ARE THE DIRECTION A WIDER TRIGGER WOULD HAVE
      # BROKEN. A BEFORE ROW trigger fires before the table's CHECK constraints,
      # so both rows reach 0047's guard first and must pass through it to be
      # refused BY NAME by plan_versions_publish_decision_recorded, as they were
      # at 0046.
      #
      # Each rejection asserts the CHECK NAMED IN THE MESSAGE rather than a bare
      # check_violation: a trigger RAISE carries no CONSTRAINT_NAME, so the
      # sibling probe's GET STACKED DIAGNOSTICS CONSTRAINT_NAME technique is
      # unavailable and matching on 'OI-29 check A' / 'OI-29 check B' is the
      # equivalent discrimination.
      - name: Probe OI-29's publish-decision soundness (0047)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_publish_decision_is_sound.sql


      # 0048, ADR-128. OI-04, OI-12 and OI-13. MONEY PATH.
      #
      # EIGHT SUCCESS CASES BEFORE THE FIRST REJECTION, because every one of the
      # three functions this file probes is a PATH THAT DID NOT EXIST. The failure
      # mode is not "the guard lets something through", it is "the guard lets
      # NOTHING through", and 0034's CHECK passed thirty-two rejection assertions
      # while refusing every row there is.
      #
      # SUCCESS 1, 2 AND 3 ARE THE THREE READINGS OF CALENDAR-C3 AND ONLY ONE IS
      # OBVIOUS. What makes a calendar INSERT retroactive is that the engine has
      # already folded past the day, not that the day sits inside a
      # trading_calendar_loads coverage window. A real forward load writes a
      # coverage row for a year and then inserts every day inside it, so the
      # coverage reading would demand a revision row for all 250 of them, which is
      # the one case OI-12 says is ALREADY CORRECT.
      #
      # SUCCESS 8 IS THE TIGHTENING NOBODY WOULD NOTICE. rewrite_rule_state
      # requires a version-like input to have moved and there are TWO of them,
      # engine_version and calendar_revision_id (ADR-047). Narrowed to
      # engine_version alone it installs cleanly, satisfies every rejection, and
      # refuses every calendar-correction rewrite, which is the case that made
      # 0035 raise OI-13.
      #
      # REJECTION 6b CHECKS A CLASS THAT MOVED. 0048 replaces 0014's partial
      # unique index with a DEFERRABLE EXCLUDE constraint, because the ruled mark
      # correction was refused by the database in both directions and had never
      # been executable. A violation now raises exclusion_violation where it used
      # to raise unique_violation, so a handler written against the old class
      # would score this as passing while catching nothing.
      - name: Probe ADR-128's audited writes and CALENDAR-C3 (0048)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_audited_writes.sql

      # 0049, ADR-128. OI-01. MONEY PATH: rcr_bp is the number that pauses SALES.
      #
      # SIX SUCCESSES FIRST, for the reason section 13 gives every time: this
      # table exists to make a figure WRITABLE that had nowhere to live, so a
      # guard refusing every row would satisfy every rejection and close OI-01
      # with a table nobody can use.
      #
      # SUCCESS 4 IS THE BOUNDARY. The breaker is defined at exactly 1.0 and
      # rcr_bp is integer arithmetic, so full coverage must render 10000 and not
      # 9999. An expression that divided before it multiplied would pause sales on
      # a fully covered balance sheet. SUCCESS 5 is its mirror: truncation is
      # toward zero, so an ambiguous book falls toward ARMING the breaker.
      #
      # REJECTION 1 LOOKS LIKE DEFENSIVE PROGRAMMING AND IS NOT. A GENERATED
      # column is computed BEFORE the row's CHECK constraints, proven by
      # execution, so with a plain division a zero CVaR99 raises a bare
      # `division by zero` and reserve_coverage_snapshots_cvar99_is_positive never
      # runs. The NULLIF in 0049 is what routes the error to the constraint that
      # explains it, and this assertion reads CONSTRAINT_NAME to prove it.
      - name: Probe ADR-128's reserve coverage snapshot (0049)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_reserve_coverage.sql

      # OI-03, ADR-128. THE APPEND-ONLY SET, ASSERTED AGAINST THE DOCUMENT.
      #
      # OI-03 is not a prediction and it had already happened three times when
      # this first ran. DATA_MODEL section 1 carried THREE copies of its
      # Mutability bullet, left by three keep-both merges, reading "twenty-three
      # tables ... four migrations", "twenty-two ... three" and "twenty-two ...
      # three", over three different lists of which migrations revoke. THE
      # INSTALLED SET WAS TWENTY-FIVE. Every gate was green: CI-06u looks for
      # duplicated passages and these three had diverged, CI-06i reads table names
      # and not privileges, and nothing at all read the database's grants.
      #
      # IT IS A .mjs BECAUSE THE ITEM'S OWN WORD IS "AGAINST THE DOCUMENT", and a
      # .sql file cannot read markdown. --falsify runs FIRST and is not
      # decoration: this assertion has no natural failures to observe, and it
      # would have reported PASS on the commit carrying the three contradictory
      # paragraphs it exists to catch.
      - name: The append-only assertion is falsifiable (OI-03)
        run: |
          set -euo pipefail
          node scripts/db/assert_append_only_grants.mjs --falsify

      - name: The append-only set agrees with DATA_MODEL (OI-03)
        run: |
          set -euo pipefail
          node scripts/db/assert_append_only_grants.mjs
name: corpus

# CI-06, corpus integrity. Constitution C10: a gate that lives in a document is
# a gate somebody remembers; a gate that lives in CI is a gate.
#
# VERIFIED against PostgreSQL 16 on 2026-08-15 before first push, rather than
# shipped and hoped for: the migrations apply forward-only from empty; a
# re-apply is rejected; and all three ledger probes fire for the right reason
# (checked by message, not by exception class).
#
# THE OBJECT COUNTS ARE NOT REPEATED HERE, and that is deliberate. They read
# "96 tables, 326 indexes, 347 check constraints and 6 triggers" until
# 2026-08-16, when 0030 and 0031 made three of the four wrong in a comment
# nobody reads while the job that emits them stayed correct.
#
# AND THEN THE REPLACEMENT DRIFTED TOO, INSIDE THE COMMENT THAT DOCUMENTS THE
# DRIFT. The fix restated "30 files and 97 / 331 / 351 / 6" one sentence after
# declaring the counts would not be repeated here; 0032 landed the same day and
# made every one of those figures wrong again. A count in a comment has now
# been found wrong twice in one file on one day, which is CI-06g's whole thesis
# arriving by demonstration. No figures are stated here at all. The job below
# derives them from the database and prints them on every run, and
# DELTA_MANIFEST records them dated, once, where a gate can reach them.
#
# Every check here exists because the thing it checks ALREADY DRIFTED once:
#   CI-06a  59 links broke silently before a human found them
#   CI-06d  registry counts were quoted in gate summaries while wrong
#   CI-06f  two pull requests claimed ADR-031 from the same base
#   CI-06g  every hand-maintained count checked has been found wrong
#   CI-06h  the migration set's own object counts were stated and wrong
#   ADR-026 the delta tally was wrong on the day it was written

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI-06a..g plus the ADR-026 manifest gate. Pure Node, no services, fast.
  # ---------------------------------------------------------------------------
  integrity:
    name: CI-06 corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI-06f compares this branch's ADR headings against main's. A shallow
          # clone has no main to compare with, and the gate would pass by being
          # unable to look.
          fetch-depth: 0

      # RIDER 3, OQ-P1-03. `.nvmrc` is the only place the Node version is
      # written. This step used to carry `node-version: '22'`, which made two
      # files hold one number with nothing reconciling them: a hand-maintained
      # count in a different costume, and it drifts the same way. RI-05 in
      # packages/tooling asserts no workflow pins the version inline.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run corpus gates
        run: node scripts/corpus/gates.mjs check

      # RIDER 1. THE GATES ARE PROVEN FALSIFIABLE AS OF ONE SESSION AND NOTHING
      # KEPT THEM SO. A gate nobody has watched fail is not a gate
      # (STRATEGY section 4.4), and the step above only ever watches them pass:
      # a gate silently narrowed until it reads nothing reports PASS in exactly
      # the same way as a gate that is working.
      #
      # falsify.mjs runs every gate twice, once against this tree where it must
      # pass and once against a copy carrying one seeded violation aimed at it
      # where it must fail ON THAT FINDING rather than merely exit non-zero, and
      # then runs the scope cases that assert each gate reads the right set of
      # files. It runs BEFORE the regeneration step below, which rewrites spans
      # in the working tree that falsify.mjs copies.
      - name: Gates are falsifiable
        run: node scripts/corpus/falsify.mjs

      # ADR-042's SECOND MECHANISM, and it needs no database because it is a
      # check on the SHAPE of the DDL rather than on anything installed: no
      # `interval` arithmetic against a `date` column, and no `timestamptz` cast
      # to `date`.
      #
      # IT IS VACUOUSLY TRUE TODAY, which is the argument for wiring it now
      # rather than against it. `0029` to `0031` made `interval '48 hours'`
      # idiomatic on the money path, so the next session that needs "five
      # trading days from now" has a working pattern sitting right there that
      # produces a wrong answer on roughly 104 days a year and reads as though
      # somebody thought about it.
      #
      # `--falsify` runs FIRST and is not decoration: this check has no natural
      # failures to observe, so the only evidence it works is watching it fire
      # on each seeded violation and leave four legitimate constructs alone,
      # including `interval '48 hours'` against a `timestamptz`, which is the
      # ruled unit and must never be a finding.
      - name: The date-unit shape check is falsifiable
        run: node scripts/db/assert_date_unit_shape.mjs --falsify

      - name: No interval arithmetic against a date column
        run: node scripts/db/assert_date_unit_shape.mjs

      # CI-06g is only meaningful if regenerating changes nothing. The check
      # above compares spans against their queries; this proves the generator
      # is the thing that wrote them, so a span cannot be hand-edited into
      # agreement with a stale query.
      - name: Generated spans are reproducible
        run: |
          node scripts/corpus/gates.mjs generate
          if ! git diff --quiet; then
            echo "::error::Regenerating spans changed the tree. A count in a document is stale."
            git --no-pager diff
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # CI-06h. The migration set installs from empty, and the object counts the
  # corpus states are derived FROM THE DATABASE rather than from a grep.
  # ---------------------------------------------------------------------------
  migrations:
    name: CI-06h migration install and object counts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: merit
          POSTGRES_DB: merit_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: merit
      PGDATABASE: merit_ci

    steps:
      - uses: actions/checkout@v4

      # 1. Forward-only apply from empty, in order, zero errors.
      #    ON_ERROR_STOP is the whole point: psql's default is to continue past
      #    a failed statement and exit 0, which would report a green install of
      #    a schema that is missing tables.
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in packages/db/migrations/*.sql; do
            echo "-- applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # 2. A second apply of the whole set MUST fail. This proves no migration
      #    is accidentally idempotent-by-rerun, which would mean it is not
      #    actually creating what it claims to create.
      - name: Re-applying the set fails
        run: |
          set -uo pipefail
          if psql -v ON_ERROR_STOP=1 -q -f packages/db/migrations/0001_extensions_and_enums.sql 2>/dev/null; then
            echo "::error::0001 re-applied cleanly. A migration that is idempotent by rerun is not creating what it claims."
            exit 1
          fi
          echo "Re-apply correctly rejected."

      # 3. The object counts, derived from the database. These are the two
      #    numbers a grep of the DDL gets wrong by a third, because Postgres
      #    backs every primary key and unique constraint with an index.
      - name: Derive object counts
        run: |
          set -euo pipefail
          psql -At -c "
            select 'tables=' || count(*) from pg_tables where schemaname='public'
            union all
            select 'indexes=' || count(*) from pg_indexes where schemaname='public'
            union all
            select 'checks=' || count(*) from pg_constraint c
              join pg_namespace n on n.oid=c.connamespace
              where n.nspname='public' and c.contype='c'
            union all
            select 'triggers=' || count(*) from pg_trigger t
              join pg_class cl on cl.oid=t.tgrelid
              join pg_namespace n on n.oid=cl.relnamespace
              where n.nspname='public' and not t.tgisinternal
          " | tee object_counts.txt

      # 4. The counts the corpus DOES state must match the database.
      #    sql_tables and sql_triggers are generated spans; this is the check
      #    that the grep-derived span agrees with the installed truth.
      - name: Spanned counts agree with the database
        run: |
          set -euo pipefail
          db_tables=$(grep '^tables=' object_counts.txt | cut -d= -f2)
          db_trigs=$(grep '^triggers=' object_counts.txt | cut -d= -f2)
          # grep -o | wc -l rather than grep -c | bc: grep exits 1 when NO file
          # matches, which under set -e aborts the step with a confusing error
          # instead of reporting zero. wc always exits 0.
          sql_tables=$(grep -hoE '^CREATE TABLE ' packages/db/migrations/*.sql | wc -l)
          sql_trigs=$(grep -hoE '^CREATE (CONSTRAINT )?TRIGGER ' packages/db/migrations/*.sql | wc -l)
          fail=0
          [ "$db_tables" = "$sql_tables" ] || { echo "::error::tables: DDL says $sql_tables, database says $db_tables"; fail=1; }
          [ "$db_trigs" = "$sql_trigs" ] || { echo "::error::triggers: DDL says $sql_trigs, database says $db_trigs"; fail=1; }
          exit $fail

      # OI-08. NO-FLOATS, ASSERTED WHERE IT CAN SEE THE WHOLE SCHEMA.
      #
      # The assertion was written as a DO block inside 0027, so it reads
      # information_schema AS OF 0027. That was true the day it was written and
      # false the day 0028 landed. By 0032 there were FIVE MIGRATIONS OUTSIDE
      # THE GUARD THE CORPUS BELIEVED PROTECTED EVERY MONEY COLUMN, and a later
      # migration adding a numeric money column would have sailed past it.
      # Nothing failed; the guard was simply not looking, which is why this was
      # found by hand rather than by CI.
      #
      # Here it runs after every migration has applied, so it is positionally
      # last BY CONSTRUCTION rather than by whoever remembers to move it. A
      # migration numbered 0099 is inside this guard on the day it is written.
      #
      # 0027's copy is deliberately NOT deleted: migrations are sacred, once
      # merged never edited, only superseded (constitution E2). It still passes
      # and it is now a historical assertion about the schema at 0027.
      #
      # THE FILE FALSIFIES ITSELF, one seeded violation per direction, because
      # an assertion only ever run against a schema that satisfies it reports
      # PASS in exactly the same way as one narrowed until it reads nothing.
      - name: NO-FLOATS holds over the whole applied schema (OI-08)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/assert_no_floats.sql

      # 5. The ledger constraints that carry rulings, probed against the real
      #    database. Each is one perturbation. A constraint nobody has seen
      #    reject anything is a constraint nobody knows is wired up.
      - name: Probe ADR-027's ledger constraints
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_ledger_constraints.sql

      # RIDER 2. ADR-035's guard, verified by nothing since the session that
      # fixed it. `assert_published_plan_version_immutable()` read `NEW.config`
      # on a table whose rule contract is `rules`; PL/pgSQL resolves record
      # fields at execution rather than at CREATE FUNCTION, so the migration
      # installed cleanly, every existing probe passed, and the function was
      # wrong only when it fired. It fired on the one transition the design
      # permits and no plan version could be retired.
      #
      # A PROBE THAT SHIPS BESIDE A FIX AND NEVER RUNS AGAIN IS THE SAME OBJECT
      # AS THE GOLDEN TEST THAT WAS MISSING. This job ran only the ledger probe
      # until now.
      - name: Probe ADR-035's plan-version immutability guard
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_plan_version_immutability.sql

      # 7. ADR-040 and ADR-041, the payout enforcement window and the identity
      # restriction episode, probed against the real database.
      #
      # ELEVEN ASSERTIONS AND THE FIRST SIX ARE SUCCESSES. Section 13 of the
      # delta manifest is why: every probe that only ever attempts a forbidden
      # thing passes against a guard that rejects everything, so the successes
      # come first and the rejections come after them.
      #
      # This probe also covers the one defect this fold inherited rather than
      # introduced: 0011 gave wallet_withdrawals a freeze clock, a freeze flag
      # and an expiry index while wallet_withdrawal_status has no frozen value,
      # so THE HALT WAS REPRESENTABLE AND ENTIRELY UNENFORCED. 0031 is the
      # enforcement and REJECTION 3 is what watches it fire.
      - name: Probe ADR-040 and ADR-041's payout hold and restriction episode
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_payout_hold.sql

      # 8. ADR-039, phone identity and passwordless auth. OI-07.
      #
      # FOLD-01 session 3 executed forty-eight assertions against 0029 and
      # COMMITTED NONE OF THEM. They were watched passing once and then existed
      # only as a table in DELTA_MANIFEST section 14, which is the exact object
      # section 13 names: a probe that ships beside a fix and never runs again
      # is the same thing as the golden test that was missing.
      #
      # IT LEADS WITH THE SUCCESS CASE, and on this migration that is not a
      # stylistic preference. 0029's central ruling is something the database
      # must NOT do: ADR-039 splits the hard link in two and leaves
      # phone -> identity deliberately unconstrained, so a SECOND IDENTITY
      # VERIFYING A LIVE NUMBER MUST COMPLETE and raise the flag. An absence is
      # invisible in a diff, and "completing the pair" with a unique index on
      # phone_hash looks like tightening a constraint while actually refusing
      # the innocent owner of a recycled number at the door, before the
      # portability check that exists to rescue them can run (amendment 3).
      # SUCCESS 2 is what fails the day somebody does it.
      #
      # Rejections are checked by THE CONSTRAINT THAT FIRED, read out of GET
      # STACKED DIAGNOSTICS, never by exception class: before 0028 a retirement
      # raised undefined_column and a handler catching "any error" scored that
      # as the constraint working.
      - name: Probe ADR-039's phone identity and auth (OI-07)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_phone_identity.sql

      # 9. ADR-045, the calendar prior-image guards installed by 0033. OI-06.
      #
      # IT FORCES THE DEFERRED CHECK INSTEAD OF WAITING FOR A COMMIT THAT NEVER
      # COMES. CALENDAR-C1 is a deferrable constraint trigger and the probe ends
      # in ROLLBACK like every other probe here, so its four success cases would
      # otherwise be checked by nothing at all: the file would print four green
      # successes having verified none of them, which is the vacuous-pass shape
      # this corpus has now found in a CHECK, in a DO block and in a falsify
      # seed. `SET CONSTRAINTS ... IMMEDIATE` applies the pending checks
      # retroactively, and every assertion in the file runs because of it.
      #
      # Rejections are checked BY MESSAGE. Both halves of CALENDAR-C1 raise
      # check_violation, so a handler catching the class cannot tell "no prior
      # image" from "the count is wrong", and the counted half could be deleted
      # with every rejection still passing.
      - name: Probe ADR-045's calendar prior-image guards (OI-06)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_calendar_revision_required.sql

      # 10. ADR-046, the reversible contact addresses and the dispatcher role
      # installed by 0034. OQ-M10-06.
      #
      # HALF OF WHAT THIS ONE PROVES IS A GRANT, WHICH NO OTHER PROBE IN THIS
      # JOB TOUCHES. The founder's amendment to ADR-046 is that the sending path
      # gets SELECT, INSERT and a rotation UPDATE and NEVER DELETE, and a
      # migration that grants DELETE by accident installs cleanly, satisfies
      # every constraint in the file, and is wrong in the exact way the
      # amendment exists to prevent. So the assertions `SET LOCAL ROLE
      # merit_dispatcher` and attempt the write, because a catalogue query
      # proves what was written and an attempted write proves what the database
      # will do.
      #
      # IT LEADS WITH ERASURE, and that is the assertion to read. Withholding
      # DELETE is only defensible if erasure is expressible WITHOUT it, so S4
      # clears the three sealed columns and then checks that the value_hash
      # INV-M16-03 matches on is still there. A NOT NULL on any of the three
      # would have made DELETE the only way to erase, on the tables that no
      # longer have it.
      - name: Probe ADR-046's reversible addresses and dispatcher grants (OQ-M10-06)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f scripts/db/probe_reversible_contact_addresses.sql

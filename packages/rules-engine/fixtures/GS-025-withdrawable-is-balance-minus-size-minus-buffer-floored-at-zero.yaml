# GS-025  Withdrawable is balance minus size minus buffer, floored at zero
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   `withdrawable = max(0, balance_cents - size_cents - buffer_cents)`. The
#   buffer is permanent and is never withdrawable                M01 R-35
#   `withdrawable_cents >= 0` always                             M01 INV-05
#   buffer  100,000c at 50K, 200bp                               M01 Appendix A.1
#   "Balance below `size + buffer` yields exactly 0, never a negative"
#                                                                GOLDEN_SCENARIOS GS-025 row
#
# THE BALANCE IS INSIDE THE BUFFER BY 10,000c AND THAT IS THE SCENARIO.
# 5,090,000 - 5,000,000 - 100,000 is -10,000, so the account is profitable and
# has nothing withdrawable, and the field that reports it must be 0 rather than
# the negative the subtraction produces. A trader who has made 90,000c and can
# withdraw none of it is the case the buffer exists to create, and R-35's `max`
# is the only thing standing between that and a negative money field.

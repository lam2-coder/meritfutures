  - trading_day: 2026-11-05
    opening_balance_cents: 15089999
    closing_balance_cents: 15320000
    high_balance_cents: 15325000
    low_balance_cents: 15085000
    realized_pnl_cents: 230001
    fill_count: 6
    traded_day: true

# GS-044  Passes eval while payouts are frozen  (Appendix B4 item 15)
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   "Progression continues, `phase.passed` fires, payouts stay gated, comms
#   template fires. Freezing is not a rule input to progression"
#                                                 GOLDEN_SCENARIOS GS-044 row
#   Context gates: "not `payoutsFrozen` at account or identity level ...
#   Evaluated at read time, excluded from the replayed state"     M01 R-40
#   "Context gates (frozen, recon, KYC, in flight) never enter the replayed
#   state or its hash"                                            M01 INV-23
#   eval profit target 300,000c at 50K, 600bp                     M01 Appendix A.1
#   eval min trading days 1                                       M01 Appendix A.1
#   funded drawdown 250,000c at 50K, 500bp                        M01 Appendix A.1
#   4,750,000 = 5,000,000 - 250,000                               M01 R-12, R-31, ADR-050
#   floor lock at 260,000c of closing profit                      M01 Appendix A.1
#   win day floor 15,000c at 50K, 30bp                            M01 Appendix A.1
#   buffer 100,000c at 50K, 200bp                                 M01 Appendix A.1
#   20,000 = 5,120,000 - 5,000,000 - 100,000                      M01 R-35
#   the day after 2026-11-02 is 2026-11-03                        fixtures/calendars/cme-2026.json
#
# THE FREEZE APPEARS NOWHERE IN THIS FILE AND THAT IS THE WHOLE FIXTURE. B4 #15
# asks what happens to progression while payouts are frozen, and the answer M01
# gives is structural rather than conditional: `payoutsFrozen` is one of R-40's
# context gates, INV-23 keeps every context gate out of the replayed state and
# out of its hash, and the day fold therefore has no input to carry it. A
# fixture cannot state the freeze because there is no key for one, and L-02
# refuses an invented key rather than ignoring it. **So the assertion is that
# this stream's outcome is the outcome, full stop**: an engine that let a freeze
# reach progression would need an input this format cannot supply and a state
# field this expectation does not pin.
#
# THE PASS DAY IS ALSO A LOCK DAY, WHICH IS UNAVOIDABLE ON EVERY V1 PLAN. The
# lock trigger is 260,000c of closing profit and the eval target is 300,000c, so
# no Core EOD eval pass can happen below the trigger. DO-7 precedes DO-8, so
# `rule.floor_locked` is emitted before `phase.passed`.
#
# ADR-048 POLARITY: DIRECT. Every rule this fixture cites (R-08, R-09, R-15,
# R-21, R-26, R-27, R-31, R-35, R-40) is in the engine's declared
# `IMPLEMENTED_RULES` set, so under ADR-048's derivation this fixture is one the
# engine must MATCH rather than one it must fail. The derivation is not wired
# yet: the loader still folds `evaluate`, which is the scaffold's identity stub,
# and `engineIsIdentityStub()` still decides direction globally. The citation is
# written to be resolvable now so the wiring session inherits it.

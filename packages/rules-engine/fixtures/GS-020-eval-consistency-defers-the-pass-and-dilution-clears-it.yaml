# GS-020  Eval consistency defers the pass and dilution later clears it
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   eval consistency is tested ONLY on days where R-26 and R-27 already hold,
#   failing DEFERS the pass and emits `phase.pass_deferred_consistency`, and
#   IT NEVER FAILS AN ACCOUNT                                      M01 R-28
#   consistency arithmetic  `best_day_cents * 10000 <= max_day_share_bp *
#                           period_profit_cents`                   M01 R-29
#   eval consistency  3000bp                            M01 Appendix A.2 at 50K
#   eval profit target  300,000c                        M01 Appendix A.2 at 50K
#   eval minimum trading days  2                        M01 Appendix A.2 at 50K
#   eval drawdown  250,000c, funded drawdown 250,000c   M01 Appendix A.2 at 50K
#   floor lock at profit  260,000c                      M01 Appendix A.2 at 50K
#   eval pass effects: phase `funded`, `balance = size_cents`,
#   `floor = size_cents - funded drawdown_cents`                   M01 R-31
#   "Best day is 40% of profit on the pass day: deferred, never failed. Two
#    more profitable days dilute to under 30% and the pass fires"
#                                          GOLDEN_SCENARIOS GS-020 row
#
# THE STREAM IS THE REGISTRY ROW'S OWN SHAPE, ARRANGED SO THE FIRST TEST LANDS
# AT EXACTLY 40 PERCENT. The target is not met until day three, so day three is
# the first day the gate is evaluated at all:
#
#   day 3  best 160,000 of period profit 400,000              = 40.0%   defer
#   day 4  best 160,000 of period profit 480,000              = 33.3%   defer
#   day 5  best 160,000 of period profit 540,000              = 29.6%   PASS
#
#   the day-five comparison  160,000 * 10000 = 1,600,000,000
#                            3000 * 540,000  = 1,620,000,000     `<=` holds
#
# "TWO MORE PROFITABLE DAYS" IS LITERAL: days four and five each add profit and
# neither exceeds the best day, so the ratio falls without the numerator moving.
# That is the only way dilution can work, and it is why the scenario is about
# the denominator rather than about the trader having a smaller day.
#
# THE ACCOUNT IS NEVER AT RISK ON ANY OF THESE DAYS. Two deferrals are two days
# on which an engine that treated consistency as a failure would have closed a
# profitable account, which is the reading R-28 exists to forbid.
#
# THE LOCK ENGAGES ON DAY THREE, when profit first passes 260,000c. DO-7 runs
# before DO-8, so `rule.floor_locked` precedes that day's deferral.

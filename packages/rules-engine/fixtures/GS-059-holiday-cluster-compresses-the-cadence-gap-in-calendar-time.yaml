# GS-059  Holiday cluster compresses the cadence gap in calendar time
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01,
# GOLDEN_SCENARIOS section 1). Every number below traces to a document:
#
#   "Gap counting is `calendar.sequence` subtraction, never date arithmetic"
#                                                             M01 R-02
#   "A half day is a full trading day for every counter"       M01 R-03
#   traded day is `fill_count > 0`, strict `>`                 M01 R-08
#   win day is `realized_pnl_cents >= win_day_floor_cents`     M01 R-09
#   `hwb' = max(hwb, closing)`, `floor' = hwb' - drawdown`     M01 R-13
#   the breach comparator is the floor AT THE OPEN            M01 R-18
#   `low_balance_cents < floorOpenCents`, strict `<`           M01 R-21
#   win days counted strictly after `payoutAnchorDay`          M01 R-34
#   `withdrawable = max(0, balance - size - buffer)`           M01 R-35
#   `count(trading days d : cadenceAnchorDay < d <= basisDay)
#    >= cadence_gap_trading_days`, by `calendar.sequence`      M01 R-37
#   settlement advances both anchors                           M01 R-46
#   win days and the consistency period reset on settlement    M01 R-47
#   `lifetimeSettledCents += approvedCents`                    M01 R-50
#   50K size                 5,000,000c                        M01 Appendix A, sizes line
#   Core EOD funded drawdown 250,000c at 50K, 500bp            M01 Appendix A.1
#   Core EOD win day floor   15,000c at 50K, 30bp              M01 Appendix A.1
#   Core EOD buffer          100,000c at 50K, 200bp            M01 Appendix A.1
#   Core EOD cadence gap     5 trading days                    M01 Appendix A.1
#   Core EOD required win days 5                               M01 Appendix A.1
#
# THE CLUSTER IS TRANSCRIBED AND NOT SYNTHESIZED, WHICH IS THE WHOLE REASON THIS
# ROW CAN BE WRITTEN AT ALL. `calendars/cme-2026.json` is `status: "partial"` and
# 78 of its 83 sessions are synthetic. TWO OF ITS TRANSCRIBED DAYS CARRY THIS
# FIXTURE and both come out of the same committed CME artifact, named in that
# file's own `transcribed_from.christmas` block:
#
#   `packages/db/src/seed/calendars/cme-trading-hours-2026-12-24-to-2026-12-26-christmas.retrieved-2026-08-17.xlsx`
#
#   2026-12-24  EARLY CLOSE, `kind: "half"`. Latest close across F-3's six
#               products is 12:45 CT. It is a SESSION and R-03 makes it a full
#               trading day for every counter, including R-37's
#   2026-12-25   HOLIDAY, and therefore an ABSENCE rather than a row. The file's
#               own note records that it is a FRIDAY and absorbs nothing: "the
#               next session is Monday 2026-12-28 and it opens Sunday
#               2026-12-27 at 17:00 CT like any other Monday"
#
# THE SESSIONS BETWEEN THEM (2026-12-10 to 2026-12-23, and 2026-12-28) ARE
# SYNTHETIC ordinary weekdays. They are load bearing only as weekdays: what this
# fixture measures is the shape of the cluster, and the cluster is the
# transcribed half.
#
# THE ASSERTION IS TWO COUNTS OVER ONE WINDOW, AND THE SECOND IS THE ONE A
# BROKEN ENGINE GETS RIGHT BY ACCIDENT. The cadence anchor is 2026-12-18 and the
# last day of the stream is 2026-12-24. Between them:
#
#   TRADING DAYS, by `calendar.sequence` subtraction (R-37):  4
#     sequence(2026-12-24) - sequence(2026-12-18) = 77 - 73
#     the counted sessions are 12-21, 12-22, 12-23 and 12-24
#   CALENDAR DAYS, by date arithmetic:                        6
#     2026-12-24 minus 2026-12-18
#
# `cadence_gap_trading_days` IS 5. So an engine that subtracted dates opens the
# gate on this stream and an engine that subtracts sequence does not, and the
# expectation pins the closed one. That is R-02's "never date arithmetic"
# arriving on R-37, which is the one gate where a trader loses money over it.
#
# AND THE HALF DAY IS INSIDE THE COUNTED WINDOW ON PURPOSE. 2026-12-24 is the
# fourth of the four counted sessions. An engine that scored the shortened
# session as a fraction of a day, or skipped it, counts 3 rather than 4 and
# fails on `trading_days_since_last_payout`. R-03 says "no effect on any
# comparison" and R-37 is a comparison; no fixture reached that pair before.
#
# THE COMPRESSION FIGURE THE REGISTRY ROW IS ABOUT IS CARRIED BY
# `next_eligible_trading_day`, WHICH IS AS-06's WHOLE COUNTER. The fifth counted
# trading day after 2026-12-18 is sequence 73 + 5 = 78, which is 2026-12-28:
# TEN CALENDAR DAYS after the anchor. The same five trading days after an
# ordinary Friday anchor inside this calendar's coverage is SEVEN calendar days
# (2026-09-11 anchors 09-14, 09-15, 09-16, 09-17 and 09-18, five contiguous
# weekday sessions). 2026-12-25's transcribed ABSENCE is the entire difference:
# were it a session it would be sequence 78 and the resolved date would read
# 2026-12-25.
#
# NOTHING BREACHES, PASSES OR LOCKS, ON PURPOSE. The account is funded
# throughout, every low sits above the floor the day opened with (R-21, R-18),
# the closing balance tops out 200,000c above size against a 260,000c lock
# trigger (R-15), and the ladder is 1 settlement of 5 (R-49). The subject is the
# gap counter and the date it resolves to, and nothing else is allowed to move.
id: GS-059
name: holiday cluster compresses the cadence gap in calendar time
source: M01 R-02, R-03, R-08, R-09, R-13, R-18, R-21, R-34, R-35, R-37, R-46, R-47, R-50

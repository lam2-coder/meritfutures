# GS-010  Floor never retreats after a losing day
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   hwb' = max(hwb, closing_balance_cents); floor' = hwb' - drawdown_cents
#                                                            M01 R-13
#   "The floor never retreats ... follows from `max`"         M01 R-14
#   "The floor never decreases. No exception, no phase qualifier, no settlement
#   carve-out"                                                M01 INV-06
#   "close falls to 5,020,000, floor stays 4,850,000"         GOLDEN_SCENARIOS GS-010 row
#   4,850,000 = 5,100,000 - 250,000                           M01 Appendix A.1 at 50K
#
# THIS IS GS-009'S DAY WITH A SECOND DAY AFTER IT. The first day is GS-009
# exactly, which is what makes the pair legible: GS-009 pins that the floor
# rises to 4,850,000 and this file pins that the losing day which follows does
# not take it back. The registry row states both numbers.
#
# THE SECOND DAY IS ARRANGED SO ONLY R-14 CAN DECIDE IT. Its low of 5,010,000c
# is far above the floor at open of 4,850,000c, so R-21 cannot fire; its close
# is below the high-water balance, so R-13's `max` is the only operator with
# anything to do.

# GS-024  Consistency one cent over the threshold does not pass
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   consistency arithmetic  `best_day_cents * 10000 <= max_day_share_bp *
#                           period_profit_cents`                   M01 R-29
#   failing DEFERS the pass, never fails the account               M01 R-28
#   eval consistency  3000bp                            M01 Appendix A.2 at 50K
#   eval profit target  300,000c                        M01 Appendix A.2 at 50K
#   eval minimum trading days  2                        M01 Appendix A.2 at 50K
#   eval drawdown  250,000c                             M01 Appendix A.2 at 50K
#   floor lock at profit  260,000c, locked floor size + 10,000c
#                                                       M01 Appendix A.2 at 50K
#   "Eligibility is delayed, never denied"     GOLDEN_SCENARIOS GS-024 row
#
# THIS IS GS-023 WITH ONE CENT MOVED FROM THE LAST DAY TO THE FIRST. The period
# profit is identical and only the best day changes, which is what makes the
# pair a boundary rather than two scenarios that happen to disagree.
#
#   period profit  150,001 + 150,000 + 150,000 + 49,999  =   500,000c  (same)
#   best day                                             =   150,001c  (+1c)
#   150,001 * 10000                                      = 1,500,010,000
#   3000    *  500,000                                   = 1,500,000,000
#   1,500,010,000 > 1,500,000,000, so `<=` does not hold and the pass defers.
#
# THE ACCOUNT IS NOT FAILED AND THAT IS THE POINT OF R-28. It stays in `eval`,
# keeps trading, and is re-tested from scratch every day. Four more cents of
# period profit would clear it: M01 section 3.6 computes the shortfall as
# `ceilDiv(best * 10000 - bp * profit, bp)` = `ceilDiv(10,000, 3000)` = 4c.
# That number is NOT pinned below, because the expectation sibling has no home
# for a gate result and inventing one would be inventing a format.

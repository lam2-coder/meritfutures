# GS-017  Eval passes at exactly the profit target
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   profit target  `closing_balance_cents - size_cents >= profit_target_cents`
#                  (`>=`)                                     M01 R-26
#   minimum trading days, eval  `tradedDaysCount >= min_trading_days`  M01 R-27
#   eval profit target  300,000c at 50K, 600bp                M01 Appendix A.1
#   eval minimum trading days  1                              M01 Appendix A.1
#   eval consistency  disabled                                M01 Appendix A.1
#   eval pass effects: phase to `funded`, `balance = size_cents`,
#   `floor = size_cents - funded drawdown_cents`              M01 R-31
#   4,750,000 = 5,000,000 - 250,000                           M01 Appendix A.1 at 50K
#   "`300,000 >= 300,000` passes"                             GOLDEN_SCENARIOS GS-017 row
#
# THE CLOSE IS THE TARGET TO THE CENT and the day carries fills, so both halves
# of the pass condition sit on their first satisfying value: profit is exactly
# 300,000c against R-26's `>=`, and one traded day is exactly the 1 R-27 wants.
# Eval consistency is disabled on this plan, so R-28 to R-30 have nothing to
# defer and the pass fires on the same day. GS-018 is this file one cent lower.
#
# THIS DAY ALSO CROSSES THE FLOOR-LOCK TRIGGER, WHICH IS NOT AVOIDABLE ON THIS
# PLAN. The lock engages at 260,000c of profit and the eval target is 300,000c
# (M01 Appendix A.1), so every Core EOD eval pass is also a lock day: DO-7 runs
# before DO-8, so `rule.floor_locked` is emitted before `phase.passed`. See the
# sibling's note for what that costs this expectation and what it does not.
id: GS-017
name: eval passes at exactly the profit target
source: M01 R-26, R-27, R-31
plan: CORE-50K
calendar: cme-2026
account:
  phase: eval
  opened_on: 2026-11-02
  size_cents: 5000000
days:
  - trading_day: 2026-11-03
    opening_balance_cents: 5000000
    closing_balance_cents: 5300000
    high_balance_cents: 5305000
    low_balance_cents: 4995000
    realized_pnl_cents: 300000
    fill_count: 6
    traded_day: true
settlements: []

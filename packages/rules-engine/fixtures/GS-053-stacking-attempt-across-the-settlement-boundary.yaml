# GS-053  Stacking attempt across the settlement boundary
#
# DERIVED FROM THE PLAN DOCUMENTS, NEVER FROM IMPLEMENTATION OUTPUT (TR-01).
#
#   "Request 2 lands the instant request 1 credits the wallet: WIN DAYS HAVE
#   RESET TO THE BASIS-DAY ANCHOR, SO IT FAILS THE WIN-DAY GATE rather than
#   paying. Under ADR-019 that boundary is the same trading day rather than days
#   later, which makes this the ONLY remaining line of defence on the internal
#   leg"                                              GOLDEN_SCENARIOS GS-053
#   AS-01  three requests against a withdrawable that only ever supported one
#                                                                M01 section 7
#   R-47   `winDaysCount = count of win days d > payoutAnchorDay`      M01 R-47
#   R-46   `payoutAnchorDay = fact.basisTradingDay`                    M01 R-46
#   R-34   `winDaysCount >= required_count`, counted strictly after the anchor
#                                                                     M01 R-34
#   R-10   the withdrawal reaches the mark as `adjustment_cents`, applied at the
#          OPEN of the effective day                            M01 R-10, SD-01
#   R-48   a settlement leaves the floor, the high-water balance and the lock
#          untouched                                                  M01 R-48
#   size 5,000,000c, funded drawdown 250,000c, buffer 100,000c, win day floor
#   15,000c, win days required 5, payout cap 150,000c, min payout 10,000c,
#   cadence gap 5 trading days, consistency 3000bp
#                                                       M01 Appendix A.1 at 50K
#
# THE STREAM IS AS-03's MINIMUM-VARIANCE PATH AND THE REUSE IS DELIBERATE. Five
# days at exactly 50,000c give five win days against a required five and a
# withdrawable of exactly 150,000c against a 150,000c cap, so request 1 is one
# R-43 would have approved to the cent. GS-055, GS-065 and GS-068 walk the same
# five days, and GS-068's own sibling states why that is the argument rather than
# an economy: a settlement a fixture states is a fact the payout pipeline has
# already approved, so a stream that would have been REFUSED proves nothing about
# what happens after it settles.
#
# WHERE THIS FIXTURE PARTS FROM GS-068, AND IT IS ONE MARK. GS-068's effective
# day earns 40,000c and pins R-47's PERIOD BOUNDARY. This one earns 1,000c, which
# is deliberately below the 15,000c win floor, so `win_days_count` is 0 rather
# than 1 and the win-day gate reads `have: 0` against `need: 5`. That is the
# starkest form of the row's claim: the counter the trader spent five days
# building is gone the moment the first payout settles, and request 2 meets a
# gate at zero.
#
# WHY THIS ROW WAITED FOR A NESTED COMPARISON. Its state half -- the counter
# reset to the basis-day anchor -- is what GS-068 now pins. What is GS-053's own
# is the GATE VERDICT, `win_days.pass: false`, which lives inside `engine_gates`.
# That is a nested object and `compare.ts` diffed flat fields with `Object.is`
# until this batch, so no value could ever match. Writing this row on its state
# half alone would have been a half-row wearing a whole row's id, which is
# GS-049's objection and is why batch 10 declined it.
#
# THE ROW NAMES THE WIN-DAY GATE AND THREE OTHERS ALSO REFUSE ON THIS DAY, WHICH
# IS STATED RATHER THAN GLOSSED. See the sibling. This fixture does NOT claim the
# win-day gate is the uniquely binding one; that claim has a different shape and
# belongs to GS-082, which is not writable in this format.

# The workspace, per P1-monorepo-scaffold section 3.
#
# `apps/*` are DEPLOYABLES and `packages/*` are LIBRARIES, and the split is not
# decoration: VG-4 is "a custom ESLint rule banning raw client imports in app
# paths" (STRATEGY section 4.2), and a rule phrased over "app paths" is
# expressible only if app paths are a glob. `worker` sits in `apps/` for the
# same reason, ruled as a plan decision in P1 section 2.1: it is a deployable
# with its own lifecycle, not a library anything imports.
packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain control, VG-12. pnpm 10 does not run a dependency's install
# scripts unless it is named here, and an empty list means every one of them is
# an explicit admission decision rather than a default. A package that needs a
# build step gets added with the same human approval any new package gets.
onlyBuiltDependencies: []

# -----------------------------------------------------------------------------
# THE CATALOG: one version of one dependency, in one place
# -----------------------------------------------------------------------------
# Every package.json in this workspace writes `"eslint": "catalog:"` and the
# version lives here. This is the same argument rider 3 makes about the Node
# version: a number written in seven manifests is a hand-maintained count, and a
# hand-maintained count drifts. VG-12's human approval then happens once, on a
# diff to this block, rather than once per manifest that happened to be edited.
#
# The versions are EXACT, per .npmrc's `save-exact`. A range is a version
# nobody chose.
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 22.20.1
  # `@types/pg` is a DEV type package and `pg` is a runtime dependency, so they
  # are versioned independently and are not expected to match. ADR-084.
  '@types/pg': 8.23.1
  # THE REACT TYPES LAND WITH THE FRAMEWORK AND NOT WITH THE FIRST PAGE, and the
  # reason is a collision rather than tidiness. ADR-095 ruling 1: P4 section 9
  # rows `pnpm-lock.yaml` as SERIAL three ways across P4-c, P4-d and P4-i, and
  # the two slices that actually write pages, P4-e and P4-h, hold neither this
  # file nor the lockfile in their fences. A page-writing slice that had to add
  # `@types/react` would be joining a serialization nobody scheduled it into.
  # They are DEV type packages against runtime `react` and `react-dom` and are
  # versioned independently of them, which is ADR-084's `@types/pg` argument.
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  # THE DRIVER IS `pg` AND ADR-006 DECIDES IT, NOT PREFERENCE. `pg-boss@12.28.0`
  # declares `pg: ^8.23.0` in its own `dependencies`, and ADR-006's consequence is
  # that enqueue participates in the same transaction as the state change that
  # caused it. A transaction is per-connection, so a second driver is a second
  # pool and that consequence stops being implementable.
  #
  # THE CLOSURE FIGURE IS 14 PACKAGES, 13 OF THEM TRANSITIVE, AND THE `6` THAT
  # STOOD HERE WAS `pg`'S DIRECT COUNT. This comment cited ADR-084 in the same
  # sentence that contradicted it: ADR-084 section 2 measured the closure against
  # the lockfile and reported 14, and a supply-chain control counts the closure,
  # so the narrower number understated exactly the quantity VG-12 exists to
  # weigh. postgres.js costs 0 dependencies and is the better VG-12 answer read
  # in isolation; it is refused here because it is not in isolation.
  # ADR-084, repaired by session 147 under ADR-086.
  'drizzle-orm': 0.45.2
  eslint: 10.8.1
  fast-check: 4.9.0
  # THE API's HTTP FRAMEWORK, ADR-083 ruling 3, admitted here by ADR-100.
  # `apps/api` and NO other package: the three UI surfaces are Next.js under
  # ADR-095 and `apps/worker` serves nothing.
  #
  # 5.12.1 IS THE VERSION ADR-083 SECTION 5 MEASURED, and taking a different one
  # would discard the measurement rather than update it. That section ran two
  # scratch programs against `fastify@5.12.1` on Node `v22.22.2` and recorded
  # four observed outputs: a `.ts` entry point served 200 under
  # `node --experimental-strip-types` with no build step, an unregistered route
  # answered 404 from the router, `addContentTypeParser(..., { parseAs: 'buffer' })`
  # delivered the raw bytes and the parsed object from one request, and the tree
  # declared zero install scripts. `npm view fastify version` returns 5.12.1, so
  # the measured version is also the current one and nothing is being pinned back.
  #
  # WHAT THIS ADMISSION COSTS, DIFFED FROM THE LOCKFILE THIS COMMIT WRITES.
  # See ADR-100 section 3 for the package list, the `pnpm audit` result and the
  # integrity check. `onlyBuiltDependencies: []` above is unchanged and still
  # means what it says: `pnpm install` reports no ignored build script.
  fastify: 5.12.1
  globals: 17.11.0
  # THE UI FRAMEWORK, ADR-095. App Router, in `apps/portal` and `apps/site` and
  # in NO other package: `apps/api` is ADR-083's Fastify deployable and takes
  # none, and `apps/admin` is M06's and is in no P4 slice, so ADR-095 declines to
  # decide it. M04:25 and M09:23 both name Next.js and no ADR had ever ruled a UI
  # technology; ADR-083 is the entry that looks like it does and its only
  # occurrence of the name is a REJECTED ALTERNATIVE for the API.
  #
  # WHAT THIS ADMISSION COSTS, DIFFED FROM THE LOCKFILE THIS COMMIT WRITES. The
  # closure goes 179 -> 230, `+51`, of which 36 are per-platform binaries
  # (`@next/swc-*`, `@img/*`, `@emnapi/runtime`), so one host installs far fewer.
  # FIFTEEN PACKAGES ARE THE REAL ADMISSION: @next/env, @swc/helpers,
  # @types/react, @types/react-dom, baseline-browser-mapping, caniuse-lite,
  # client-only, csstype, next, react, react-dom, scheduler, sharp, styled-jsx,
  # tslib. `pnpm audit --audit-level=low` reports no known vulnerabilities and
  # `pnpm install` ignores no build script, so `onlyBuiltDependencies: []` above
  # is unchanged and still means what it says.
  #
  # 16.3.2 RATHER THAN AN OLDER MAJOR, AND THE REFUSAL IS THE POINT. This version
  # declares `@playwright/test` as an OPTIONAL PEER, pnpm writes a package's peer
  # block into the lockfile verbatim, and CI-08's probe read that declaration as
  # an install. An older major that happens not to declare it would have kept the
  # gate quiet, which is choosing a version to hide a defect. ADR-095 section 8:
  # the probe is repaired to read an entry KEY, and CI-08's row is untouched
  # because nothing about it was wrong.
  next: 16.3.2
  pg: 8.23.0
  # THE QUEUE, ADR-006. It is in this catalog and not in `packages/db`'s because
  # `packages/queue` is the only package that names it: pg-boss is BEHIND the job
  # interface, and ADR-086's whole subject is that nothing outside that package
  # learns the vendor's name. `pg` arrives with it as a transitive of pg-boss's
  # own `dependencies`, at the same 8.23.0 this catalog already pins, so the
  # workspace holds ONE driver rather than two. ADR-086.
  'pg-boss': 12.28.0
  prettier: 3.9.6
  # `next@16.3.2` declares `react` and `react-dom` as REQUIRED peers at
  # `^18.2.0 || ^19.0.0`. They are pinned here rather than left to
  # `autoInstallPeers`, because a peer pnpm chooses is a version nobody approved
  # and `.npmrc`'s `save-exact` exists to stop exactly that. ADR-095.
  react: 19.2.8
  'react-dom': 19.2.8
  # TypeScript 6.0.3 rather than 7.0.2, and the constraint is checkable:
  # typescript-eslint@8.67.0 (and its canary) declare
  # `peerDependencies.typescript: ">=4.8.4 <6.1.0"`, so TypeScript 7 has no
  # supported lint toolchain yet. 6.0.3 is the newest stable release inside
  # that range. Revisit when typescript-eslint widens the peer.
  typescript: 6.0.3
  typescript-eslint: 8.67.0
  vitest: 4.1.10
